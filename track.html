<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Token Tracker — TokSpot</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .tracker-card { max-width: 440px; margin: 24px auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; text-align: center; }
    .token-badge { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 6px 16px; border-radius: 99px; font-weight: 700; font-size: 0.85rem; }
    .hero-number { font-size: 4.5rem; font-weight: 900; color: #0f172a; margin: 12px 0 4px; letter-spacing: -2px; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; }
    .status-waiting { background: #fef3c7; color: #b45309; }
    .status-called { background: #dcfce7; color: #15803d; animation: pulse 1.5s infinite; }
    .status-done { background: #f1f5f9; color: #64748b; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .meta-box { background: #f8fafc; border-radius: 12px; padding: 14px 10px; }
    .meta-val { font-size: 1.4rem; font-weight: 800; color: #0f172a; }
    .meta-lbl { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="tracker-card">
    <div class="token-badge" id="hospName">Connecting to Hospital…</div>
    <div style="font-size: 0.9rem; color: #64748b; margin-top: 14px;">Your Token</div>
    <div class="hero-number" id="myToken">—</div>
    
    <div id="statusWrap">
      <span class="status-pill status-waiting" id="myStatus"><i class="fa-solid fa-clock"></i> In Queue</span>
    </div>

    <div class="meta-grid">
      <div class="meta-box">
        <div class="meta-val" id="nowServing" style="color: #2563eb;">—</div>
        <div class="meta-lbl">Now Serving</div>
      </div>
      <div class="meta-box">
        <div class="meta-val" id="peopleAhead">—</div>
        <div class="meta-lbl">People Ahead</div>
      </div>
    </div>

    <div class="meta-box mt-16" style="margin-top:12px;background:#ecfdf5;border:1px solid #a7f3d0;">
      <div class="meta-val" id="estWait" style="font-size:1.15rem;color:#047857;">Calculating…</div>
      <div class="meta-lbl" style="color:#059669;">Approx Wait Time</div>
    </div>

    <div id="calledAlert" class="hidden" style="margin-top: 16px; padding: 14px; border-radius: 12px; background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; font-weight: 700;">
      <i class="fa-solid fa-bullhorn"></i> It is your turn! Proceed to counter.
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const hospitalId = params.get('h');
    const tokenId = params.get('t');

    window.addEventListener('load', async () => {
      await initFirebase();
      if (!hospitalId || !tokenId) {
        document.getElementById('hospName').textContent = 'Invalid tracking link.';
        return;
      }
      startTracking();
    });

    async function startTracking() {
      await waitForFB();
      
      // 1. Listen to patient's own token
      window._fs.onSnapshot(window._fs.doc(window._db, 'hospitals', hospitalId, 'tokens', tokenId), (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();
        document.getElementById('myToken').textContent = data.number;
        document.getElementById('hospName').textContent = (data.patientName ? data.patientName + ' · ' : '') + 'Token Status';
        
        const statusEl = document.getElementById('myStatus');
        const alertEl = document.getElementById('calledAlert');
        
        if (data.status === 'called') {
          statusEl.className = 'status-pill status-called';
          statusEl.innerHTML = '<i class="fa-solid fa-bullhorn"></i> Called to Counter ' + (data.counter || 'A');
          alertEl.classList.remove('hidden');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (data.status === 'completed') {
          statusEl.className = 'status-pill status-done';
          statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Completed';
          alertEl.classList.add('hidden');
        } else if (data.status === 'skipped') {
          statusEl.className = 'status-pill status-waiting';
          statusEl.innerHTML = '<i class="fa-solid fa-user-xmark"></i> Skipped / On-Hold';
          alertEl.classList.add('hidden');
        } else {
          statusEl.className = 'status-pill status-waiting';
          statusEl.innerHTML = '<i class="fa-solid fa-clock"></i> Waiting';
          alertEl.classList.add('hidden');
        }

        // 2. Track queue length & now serving
        trackDoctorQueue(data.doctorId, data.date, data.number);
      });
    }

    function trackDoctorQueue(doctorId, dateStr, myNumber) {
      window._fs.onSnapshot(
        window._fs.query(
          window._fs.collection(window._db, 'hospitals', hospitalId, 'tokens'),
          window._fs.where('doctorId', '==', doctorId),
          window._fs.where('date', '==', dateStr),
          window._fs.where('status', 'in', ['waiting', 'called'])
        ),
        (snap) => {
          let currentCalled = '—';
          let aheadCount = 0;
          
          snap.docs.forEach(d => {
            const t = d.data();
            if (t.status === 'called') currentCalled = t.number;
            if (t.status === 'waiting' && String(t.number) < String(myNumber)) aheadCount++;
          });

          document.getElementById('nowServing').textContent = currentCalled;
          document.getElementById('peopleAhead').textContent = aheadCount;
          
          const estMinutes = aheadCount * 5; // avg 5 mins per patient
          document.getElementById('estWait').textContent = aheadCount === 0 ? 'Any minute now!' : `~${estMinutes} mins (${aheadCount} ahead)`;
        }
      );
    }
  </script>
</body>
</html>
