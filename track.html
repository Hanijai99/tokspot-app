<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/loader.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Token Tracker — TokSpot</title>
  <link rel="stylesheet" href="css/style.css?v=20260930" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background: var(--day-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .tracker-card { max-width: 440px; margin: 24px auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; text-align: center; }
    .token-badge { display: inline-block; background: #D7EBE0; color: #2A835F; padding: 6px 16px; border-radius: 99px; font-weight: 700; font-size: 0.85rem; }
    .hero-number { font-size: 4.5rem; font-weight: 900; color: #0f172a; margin: 12px 0 4px; letter-spacing: -2px; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; }
    .status-waiting { background: #fef3c7; color: #b45309; }
    .status-called { background: #E4F3EA; color: #1F6B4C; animation: pulse 1.5s infinite; }
    .status-done { background: #f1f5f9; color: #64748b; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .meta-box { background: #f8fafc; border-radius: 12px; padding: 14px 10px; }
    .meta-val { font-size: 1.4rem; font-weight: 800; color: #0f172a; }
    .meta-lbl { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="tracker-card">
    <div class="token-badge" id="hospName" data-i18n="track.connecting">Connecting to Hospital…</div>
    <div style="font-size: 0.9rem; color: #64748b; margin-top: 14px;" data-i18n="track.yourToken">Your Token</div>
    <div class="hero-number" id="myToken">—</div>
    
    <div id="statusWrap">
      <span class="status-pill status-waiting" id="myStatus"><i class="fa-solid fa-clock"></i> <span data-i18n="track.inQueue">In Queue</span></span>
    </div>

    <div class="meta-grid">
      <div class="meta-box">
        <div class="meta-val" id="nowServing" style="color: #2563eb;">—</div>
        <div class="meta-lbl" data-i18n="token.nowServing">Now Serving</div>
      </div>
      <div class="meta-box">
        <div class="meta-val" id="peopleAhead">—</div>
        <div class="meta-lbl" data-i18n="token.ahead">People Ahead</div>
      </div>
    </div>

    <div class="meta-box mt-16" style="margin-top:12px;background:#ECF6EF;border:1px solid #D3E9DB;">
      <div class="meta-val" id="estWait" style="font-size:1.15rem;color:#1F6B4C;" data-i18n="track.calc">Calculating…</div>
      <div class="meta-lbl" style="color:#2A835F;" data-i18n="track.queueUpdate">Queue Update</div>
    </div>

    <div id="calledAlert" class="hidden" style="margin-top: 16px; padding: 14px; border-radius: 12px; background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; font-weight: 700;">
      <i class="fa-solid fa-bullhorn"></i> <span data-i18n="track.calledAlert">It is your turn! Proceed to counter.</span>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    if (window.I18N) I18N.init();
    function l10n(key, fb) { return (window.I18N && window.I18N.t) ? window.I18N.t(key) : fb; }
    const params = new URLSearchParams(window.location.search);
    const hospitalId = params.get('h');
    const tokenId = params.get('t');
    const FUNC = window.TokSpotAPI && window.TokSpotAPI.mode() === 'functions';
    let pollTimer = null;

    window.addEventListener('load', async () => {
      await initFirebase();
      if (!hospitalId || !tokenId) {
        document.getElementById('hospName').textContent = l10n('track.invalid', 'Invalid tracking link.');
        return;
      }
      startTracking();
    });

    async function startTracking() {
      await waitForFB();
      if (FUNC) { startStatusPolling(); return; }

      // 1. Listen to patient's own token
      window._fs.onSnapshot(window._fs.doc(window._db, 'hospitals', hospitalId, 'tokens', tokenId), (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();
        document.getElementById('myToken').textContent = data.number;
        document.getElementById('hospName').textContent = (data.patientName ? data.patientName + ' · ' : '') + l10n('track.tokenStatus', 'Token Status');
        
        const statusEl = document.getElementById('myStatus');
        const alertEl = document.getElementById('calledAlert');
        
        if (data.status === 'called') {
          statusEl.className = 'status-pill status-called';
          statusEl.innerHTML = '<i class="fa-solid fa-bullhorn"></i> ' + l10n('track.calledTo', 'Called to Counter %s').replace('%s', data.counter || 'A');
          alertEl.classList.remove('hidden');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (data.status === 'completed') {
          statusEl.className = 'status-pill status-done';
          statusEl.innerHTML = '<i class="fa-solid fa-check"></i> ' + l10n('track.completed', 'Completed');
          alertEl.classList.add('hidden');
        } else if (data.status === 'skipped') {
          statusEl.className = 'status-pill status-waiting';
          statusEl.innerHTML = '<i class="fa-solid fa-user-xmark"></i> ' + l10n('track.skipped', 'Skipped / On-Hold');
          alertEl.classList.add('hidden');
        } else {
          statusEl.className = 'status-pill status-waiting';
          statusEl.innerHTML = '<i class="fa-solid fa-clock"></i> ' + l10n('track.waiting', 'Waiting');
          alertEl.classList.add('hidden');
        }

        // 2. Track queue length & now serving
        trackDoctorQueue(data.doctorId, data.date, data.number);
      });
    }

    // ---- Functions mode: sanitized polling (no PII, no client reads) ----
    function renderTrackStatus(st) {
      const statusEl = document.getElementById('myStatus');
      const alertEl = document.getElementById('calledAlert');

      document.getElementById('myToken').textContent = st.number;
      document.getElementById('hospName').textContent = l10n('track.tokenStatus', 'Token Status');

      if (st.status === 'called') {
        statusEl.className = 'status-pill status-called';
        statusEl.innerHTML = '<i class="fa-solid fa-bullhorn"></i> ' + l10n('track.calledTo', 'Called to Counter %s').replace('%s', st.counter || 'A');
        alertEl.classList.remove('hidden');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else if (st.status === 'completed') {
        statusEl.className = 'status-pill status-done';
        statusEl.innerHTML = '<i class="fa-solid fa-check"></i> ' + l10n('track.completed', 'Completed');
        alertEl.classList.add('hidden');
      } else if (st.status === 'skipped') {
        statusEl.className = 'status-pill status-waiting';
        statusEl.innerHTML = '<i class="fa-solid fa-user-xmark"></i> ' + l10n('track.skipped', 'Skipped / On-Hold');
        alertEl.classList.add('hidden');
      } else if (st.status === 'canceled') {
        statusEl.className = 'status-pill status-waiting';
        statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ' + l10n('track.canceled', 'Canceled');
        alertEl.classList.add('hidden');
      } else {
        statusEl.className = 'status-pill status-waiting';
        statusEl.innerHTML = '<i class="fa-solid fa-clock"></i> ' + l10n('track.waiting', 'Waiting');
        alertEl.classList.add('hidden');
      }

      const ahead = st.aheadCount || 0;
      document.getElementById('nowServing').textContent = st.nowServing || '—';
      document.getElementById('peopleAhead').textContent = ahead;
      const ewt = Number.isFinite(st.waitEstimateMinutes) ? st.waitEstimateMinutes : null;
      document.getElementById('estWait').textContent = ahead === 0
        ? l10n('track.noAhead', 'No one is ahead of you')
        : (ewt > 0 ? l10n('track.aheadEwt', `${ahead} people ahead · ~${ewt} min estimated`).replace('%s', ahead).replace('%s', ewt) : l10n('track.aheadNoEwt', `${ahead} people ahead; no reliable time estimate`).replace('%s', ahead));
    }

    function startStatusPolling() {
      const tick = async () => {
        try {
          const st = await window.TokSpotAPI.getTokenStatus({ slug: hospitalId, tokenId });
          renderTrackStatus(st);
        } catch (e) {
          const statusEl = document.getElementById('myStatus');
          if (statusEl) {
            statusEl.className = 'status-pill status-waiting';
            statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + l10n('track.stalled', 'Tracking stalled');
          }
        }
      };
      tick();
      pollTimer = setInterval(tick, 4000);
    }

    function trackDoctorQueue(doctorId, dateStr, myNumber) {
      window._fs.onSnapshot(
        window._fs.query(
          window._fs.collection(window._db, 'hospitals', hospitalId, 'tokens'),
          window._fs.where('doctorId', '==', doctorId),
          window._fs.where('date', '==', dateStr),
          window._fs.where('status', 'in', ['waiting', 'called'])
        ),
        (snap) => {
          let currentCalled = '—';
          let aheadCount = 0;
          const served = [];

          snap.docs.forEach(d => {
            const t = d.data();
            if (t.status === 'called') { currentCalled = t.number; if (t.createdAt && t.calledAt) served.push(t); }
            if (t.status === 'waiting' && String(t.number) < String(myNumber)) aheadCount++;
          });

          document.getElementById('nowServing').textContent = currentCalled;
          document.getElementById('peopleAhead').textContent = aheadCount;

          let ewt = null;
          if (window.TokspotQueue) {
            const avg = window.TokspotQueue.averageWaitMinutes(served);
            ewt = window.TokspotQueue.estimateWaitMinutes({ waitingCount: aheadCount, avgServeMinutes: avg });
          }
          document.getElementById('estWait').textContent = aheadCount === 0
            ? l10n('track.noAhead', 'No one is ahead of you')
            : (ewt > 0 ? l10n('track.aheadEwt', `${aheadCount} people ahead · ~${ewt} min estimated`).replace('%s', aheadCount).replace('%s', ewt) : l10n('track.aheadNoEwt', `${aheadCount} people ahead; no reliable time estimate`).replace('%s', aheadCount));
        }
      );
    }
  </script>
</body>
</html>
