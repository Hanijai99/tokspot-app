<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Doctor Login — TokSpot</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    .auth-wrapper { max-width: 440px; margin: 50px auto; padding: 0 16px; }
    .auth-card { padding: 30px 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .auth-title { text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
    .auth-sub { text-align: center; font-size: 0.88rem; color: var(--slate-500); margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.84rem; font-weight: 700; color: var(--slate-700); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); box-sizing: border-box; font-size: 0.95rem; }
    .btn-submit { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 0.95rem; }
    .divider { display: flex; align-items: center; text-align: center; margin: 22px 0; color: var(--slate-400); font-size: 0.82rem; font-weight: 700; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--line); }
    .divider span { padding: 0 12px; }
    .pin-box { text-align: center; letter-spacing: 8px; font-size: 1.4rem; font-weight: 800; }
    body.dark { background: #060b16; }
    body.dark .auth-card { background: #121a2b; border-color: #24314a; }
    body.dark .form-control { background: #0b1120; border-color: #24314a; color: #f8fafc; }
    body.dark .auth-title { color: #f8fafc; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png" alt="TokSpot" /></span>TokSpot Doctor
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="location.href='staff.html'" title="Staff Portal"><i class="fa-solid fa-hospital-user"></i></button>
    <button class="icn-btn" onclick="hk.toggleDark()"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card card">
      <div class="auth-title"><i class="fa-solid fa-user-doctor" style="color:var(--green)"></i> Doctor Portal</div>
      <div class="auth-sub">Secure consultation desk authentication</div>

      <!-- Station Credentials -->
      <div class="form-group">
        <label>Hospital Code <span class="req">*</span></label>
        <input type="text" id="hospCode" class="form-control" placeholder="e.g. HOSP-1234" style="text-transform:uppercase;font-weight:800;letter-spacing:1px;" />
      </div>

      <!-- Method 1: Fast 4-Digit Room PIN -->
      <div class="form-group">
        <label style="text-align:center;">Doctor 4-Digit PIN <span class="req">*</span></label>
        <input type="password" maxlength="4" id="stationPin" class="form-control pin-box" placeholder="••••" />
      </div>
      <button id="btnPinLogin" class="btn btn-submit btn-green mt-8" onclick="doctorPinLogin()">
        <i class="fa-solid fa-door-open"></i> Open Doctor Station
      </button>

      <div class="divider"><span>OR VERIFY BY EMAIL & PIN</span></div>

      <!-- Method 2: Doctor Email + PIN (Admin configured PIN) -->
      <div>
        <div class="form-group">
          <label>Doctor Email or Name</label>
          <input type="text" id="loginEmail" class="form-control" placeholder="doctor@hospital.com" />
        </div>
        <div class="form-group">
          <label>Assigned Room PIN</label>
          <input type="password" maxlength="4" id="loginPinAlt" class="form-control pin-box" placeholder="••••" />
        </div>
        <button id="btnEmailLogin" class="btn btn-submit btn-slate" onclick="doctorEmailPinLogin()">
          <i class="fa-solid fa-id-badge"></i> Sign In with Email & PIN
        </button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    window.addEventListener('load', async () => {
      if (window.hk && hk.applyDark) hk.applyDark();
      try {
        if (typeof initFirebase === 'function') await initFirebase();
        if (typeof waitForFB === 'function') await waitForFB();
      } catch(e) {}

      // Auto-populate hospital code from URL param or Session Storage
      const urlCode = new URLSearchParams(window.location.search).get('code');
      const savedHosp = urlCode || sessionStorage.getItem('tokspot_frontdesk_hospital') || localStorage.getItem('tokspot_tv_hospital_code');
      if (savedHosp) document.getElementById('hospCode').value = savedHosp.toUpperCase();
    });

    // Helper: Resolves Hospital cleanly across Codes, Slugs, or ID
    async function resolveHospital(code) {
      const cleanCode = code.toUpperCase().trim();
      const codeNumOnly = cleanCode.replace(/^HOSP-?/i, '');

      // 1. Check direct code match
      let qHosp = await window._fs.getDocs(
        window._fs.query(window._fs.collection(window._db, 'hospitals'), window._fs.where('hospitalCode', '==', cleanCode))
      );
      if (!qHosp.empty) return { slug: qHosp.docs[0].id, data: qHosp.docs[0].data() };

      // 2. Check fallback code field
      qHosp = await window._fs.getDocs(
        window._fs.query(window._fs.collection(window._db, 'hospitals'), window._fs.where('code', '==', cleanCode))
      );
      if (!qHosp.empty) return { slug: qHosp.docs[0].id, data: qHosp.docs[0].data() };

      // 3. Check partial number match (e.g. HOSP-1234 vs 1234)
      const allHosp = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals'));
      const found = allHosp.docs.find(d => {
        const data = d.data();
        const c = (data.hospitalCode || data.code || '').toUpperCase();
        return c === cleanCode || c.replace(/^HOSP-?/i, '') === codeNumOnly || d.id.toLowerCase() === cleanCode.toLowerCase();
      });

      if (found) return { slug: found.id, data: found.data() };
      return null;
    }

    // Ensure client has read permissions
    async function ensureAuth() {
      if (!window._auth.currentUser) {
        try { await window._useAuth.signInAnonymously(window._auth); } catch(e){}
      }
    }

    // 1. PIN Login with strict Hospital Isolation
    async function doctorPinLogin() {
      const rawCode = document.getElementById('hospCode').value.trim();
      const pin = document.getElementById('stationPin').value.trim();
      const btn = document.getElementById('btnPinLogin');

      if (!rawCode) return showToast('Please enter Hospital Code.', true);
      if (pin.length !== 4) return showToast('Enter your 4-digit Room PIN.', true);

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

      try {
        await ensureAuth();
        const hospital = await resolveHospital(rawCode);
        if (!hospital) return showToast('Invalid Hospital Code.', true);

        // Fetch doctors inside this hospital
        const snap = await window._fs.getDocs(
          window._fs.collection(window._db, 'hospitals', hospital.slug, 'doctors')
        );

        if (snap.empty) {
          return showToast('No doctors registered in this hospital.', true);
        }

        // Match PIN (string safe comparison)
        const doctorDoc = snap.docs.find(d => String(d.data().pin).trim() === pin);

        if (!doctorDoc) {
          return showToast('Invalid PIN for this hospital.', true);
        }

        completeDoctorLogin(doctorDoc.id, doctorDoc.data(), hospital);
      } catch (err) {
        showToast('Login error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-door-open"></i> Open Doctor Station';
      }
    }

    // 2. Email & PIN Login (Matches doctor email and assigned PIN)
    async function doctorEmailPinLogin() {
      const rawCode = document.getElementById('hospCode').value.trim();
      const emailOrName = document.getElementById('loginEmail').value.trim().toLowerCase();
      const pin = document.getElementById('loginPinAlt').value.trim();
      const btn = document.getElementById('btnEmailLogin');

      if (!rawCode) return showToast('Please enter Hospital Code.', true);
      if (!emailOrName) return showToast('Enter doctor email or name.', true);
      if (pin.length !== 4) return showToast('Enter 4-digit PIN.', true);

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        await ensureAuth();
        const hospital = await resolveHospital(rawCode);
        if (!hospital) return showToast('Invalid Hospital Code.', true);

        const snap = await window._fs.getDocs(
          window._fs.collection(window._db, 'hospitals', hospital.slug, 'doctors')
        );

        if (snap.empty) return showToast('No doctors found.', true);

        const doctorDoc = snap.docs.find(d => {
          const doc = d.data();
          const dEmail = (doc.email || '').toLowerCase().trim();
          const dName = (doc.name || '').toLowerCase().trim();
          const dPin = String(doc.pin).trim();
          return (dEmail === emailOrName || dName.includes(emailOrName)) && dPin === pin;
        });

        if (!doctorDoc) {
          return showToast('Doctor record or PIN does not match.', true);
        }

        completeDoctorLogin(doctorDoc.id, doctorDoc.data(), hospital);
      } catch (err) {
        showToast('Login error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-id-badge"></i> Sign In with Email & PIN';
      }
    }

    function completeDoctorLogin(docId, docData, hospital) {
      const activeDoctor = {
        id: docId,
        ...docData,
        hospitalSlug: hospital.slug,
        hospitalName: hospital.data.name || hospital.slug,
        hospitalCode: hospital.data.hospitalCode || hospital.data.code
      };

      sessionStorage.setItem('activeDoctor', JSON.stringify(activeDoctor));
      sessionStorage.setItem('tokspot_frontdesk_hospital', hospital.data.hospitalCode || hospital.slug);

      showToast(`Welcome Dr. ${docData.name || ''}!`);
      setTimeout(() => {
        window.location.href = `doctor.html?code=${encodeURIComponent(hospital.data.hospitalCode || hospital.slug)}`;
      }, 400);
    }
  </script>
</body>
</html>
