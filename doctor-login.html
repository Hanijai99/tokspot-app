<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/loader.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Doctor Login — TokMark</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="logo.png?v=2" />
  <style>
    .auth-wrapper { max-width: 440px; margin: 50px auto; padding: 0 16px; }
    .auth-card { padding: 30px 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .auth-title { text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
    .auth-sub { text-align: center; font-size: 0.88rem; color: var(--slate-500); margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.84rem; font-weight: 700; color: var(--slate-700); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); box-sizing: border-box; font-size: 0.95rem; }
    .btn-submit { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 0.95rem; }
    .divider { display: flex; align-items: center; text-align: center; margin: 22px 0; color: var(--slate-400); font-size: 0.82rem; font-weight: 700; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--line); }
    .divider span { padding: 0 12px; }
    .pin-box { text-align: center; letter-spacing: 8px; font-size: 1.4rem; font-weight: 800; }
    body.dark { background: #092328; }
    body.dark .auth-card { background: #12544F; border-color: #1E5C50; }
    body.dark .form-control { background: #092328; border-color: #1E5C50; color: #f8fafc; }
    body.dark .auth-title { color: #f8fafc; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png?v=2" alt="TokMark" /></span>TokMark Doctor
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="location.href='staff.html'" title="Staff Portal"><i class="fa-solid fa-hospital-user"></i></button>
    <button class="icn-btn" onclick="hk.toggleDark()"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card card">
      <div class="auth-title"><i class="fa-solid fa-user-doctor" style="color:var(--green)"></i> Doctor Portal</div>
      <div class="auth-sub">Doctor access is unavailable until Firebase Auth accounts and server-enforced roles are provisioned.</div>

      <!-- Station Credentials -->
      <div class="form-group">
        <label>Hospital Code <span class="req">*</span></label>
        <input type="text" id="hospCode" class="form-control" placeholder="e.g. HOSP-1234" style="text-transform:uppercase;font-weight:800;letter-spacing:1px;" />
      </div>

      <!-- Method 1: Fast 4-Digit Room PIN -->
      <div class="form-group">
        <label style="text-align:center;">Doctor 4-Digit PIN <span class="req">*</span></label>
        <input type="password" maxlength="4" id="stationPin" class="form-control pin-box" placeholder="PIN sign-in disabled" disabled />
      </div>
      <button id="btnPinLogin" class="btn btn-submit btn-green mt-8" onclick="doctorPinLogin()">
        <i class="fa-solid fa-door-open"></i> Open Doctor Station
      </button>

      <div class="divider"><span>OR VERIFY BY EMAIL & PIN</span></div>

      <!-- Method 2: Doctor Email + Password (Firebase Auth) -->
      <div>
        <div class="form-group">
          <label>Doctor Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="doctor@hospital.com" autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Your secure sign-in password" autocomplete="current-password" />
        </div>
        <button id="btnEmailLogin" class="btn btn-submit btn-green" onclick="doctorEmailLogin()">
          <i class="fa-solid fa-id-badge"></i> Secure Sign In
        </button>
        <div class="muted" style="font-size:0.78rem;margin-top:10px;text-align:center;">
          Secure sign-in works after the hospital is moved to the trusted
          backend (Functions + Firebase Auth). PIN buttons above stay disabled.
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script>
    window.showToast = window.showToast || function(msg, isErr, ms) {
      let w = document.getElementById('hkToastWrap');
      if (!w) {
        w = document.createElement('div');
        w.id = 'hkToastWrap';
        w.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
        document.body.appendChild(w);
      }
      const t = document.createElement('div');
      t.style.cssText = `background:${isErr ? '#ef4444' : '#2A835F'};color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.9rem;box-shadow:0 10px 25px rgba(0,0,0,0.2);transition:opacity 0.3s;`;
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms || 2500);
    };

    window.addEventListener('load', async () => {
      if (window.hk && hk.applyDark) hk.applyDark();
      try {
        if (typeof initFirebase === 'function') await initFirebase();
        if (typeof waitForFB === 'function') await waitForFB();
      } catch(e) {}

      const urlCode = new URLSearchParams(window.location.search).get('code');
      const savedHosp = urlCode || sessionStorage.getItem('tokmark_frontdesk_hospital') || sessionStorage.getItem('tokspot_frontdesk_hospital') || localStorage.getItem('tokmark_hospital_code');
      if (savedHosp) document.getElementById('hospCode').value = savedHosp.toUpperCase();
    });

    // 1. Fast PIN Login (legacy — permanently disabled, PINs removed)
    async function doctorPinLogin() {
      showToast('Doctor PIN sign-in is disabled. Use Secure Sign In (email + password) below.', true, 5000);
    }

    // 2. Secure email + password sign-in (Firebase Auth, functions mode)
    async function doctorEmailLogin() {
      const codeInput = (document.getElementById('hospCode').value || '').trim().toUpperCase();
      const email = (document.getElementById('loginEmail').value || '').trim();
      const password = document.getElementById('loginPassword').value;

      if (!codeInput) return showToast('Enter the hospital code.', true, 4000);
      if (!email || !password) return showToast('Enter your doctor email and password.', true, 4000);

      const btn = document.getElementById('btnEmailLogin');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        // Resolve the code to a hospital slug on the server (client-side
        // hospital scans are denied by the target rules).
        let slug = String((new URLSearchParams(window.location.search).get('h') || ''));
        if (!slug) {
          const resolved = await window.TokSpotAPI.resolveHospitalByCode({ code: codeInput });
          slug = resolved.id;
        }
        if (window._auth.currentUser && !window._auth.currentUser.isAnonymous) {
          await window._useAuth.signOut(window._auth);
        }
        await window._useAuth.signInWithEmailAndPassword(window._auth, email, password);

        // Server-authoritative profile (authUid must match this account).
        const profile = await window.TokSpotAPI.getMyDoctorProfile({ slug });
        const session = {
          id: profile.id,
          name: profile.name,
          department: profile.department,
          room: profile.room,
          hospitalSlug: profile.hospitalSlug,
          hospitalName: profile.hospitalName,
          hospitalCode: profile.hospitalCode,
        };
        sessionStorage.setItem('activeDoctor', JSON.stringify(session));
        localStorage.setItem('tokmark_hospital_code', codeInput);
        window.location.replace('doctor.html');
      } catch (e) {
        let msg = e.message || 'Sign-in failed.';
        if (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') msg = 'Invalid email or password.';
        if (e.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
        if (e.code === 'auth/too-many-requests') msg = 'Too many attempts. Please try again in a minute.';
        showToast(msg, true, 5000);
        try { if (window._auth.currentUser) await window._useAuth.signOut(window._auth); } catch (_) {}
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-id-badge"></i> Secure Sign In';
      }
    }

  </script>
</body>
</html>
