<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Doctor Login — TokSpot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    .auth-wrapper { max-width: 440px; margin: 60px auto; padding: 0 16px; }
    .auth-card { padding: 30px 24px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .auth-title { text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
    .auth-sub { text-align: center; font-size: 0.88rem; color: var(--slate-500); margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.84rem; font-weight: 700; color: var(--slate-700); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); box-sizing: border-box; font-size: 0.95rem; }
    .btn-submit { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 0.95rem; }
    .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: var(--slate-400); font-size: 0.82rem; font-weight: 700; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--line); }
    .divider span { padding: 0 12px; }
    .pin-box { text-align: center; letter-spacing: 8px; font-size: 1.4rem; font-weight: 800; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png" alt="TokSpot" /></span>TokSpot
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="location.href='index.html'" title="Home"><i class="fa-solid fa-house"></i></button>
    <button class="icn-btn" onclick="hk.toggleDark()"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card card">
      <div class="auth-title"><i class="fa-solid fa-user-doctor" style="color:var(--green)"></i> Doctor Portal</div>
      <div class="auth-sub">Sign in to access your consultation room</div>

      <!-- 1. Email & Password Login -->
      <div>
        <div class="form-group">
          <label>Doctor Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="doctor@hospital.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" />
        </div>
        <button id="btnEmailLogin" class="btn btn-green btn-submit mt-8" onclick="doctorEmailLogin()">Sign In with Email</button>

        <div style="text-align: center; margin-top: 14px;">
          <a href="javascript:void(0)" onclick="handleForgotPassword()" style="color: var(--green); font-size: 0.88rem; font-weight: 600; text-decoration: none;">
            Forgot / Set New Password?
          </a>
        </div>
      </div>

      <div class="divider"><span>OR QUICK STATION PIN</span></div>

      <!-- 2. Station PIN Access -->
      <div>
        <div class="form-group">
          <label style="text-align:center;">Enter 4-Digit Station PIN</label>
          <input type="password" maxlength="4" id="stationPin" class="form-control pin-box" placeholder="••••" />
        </div>
        <button id="btnPinLogin" class="btn btn-submit" style="background: #0f766e; color: white;" onclick="doctorPinLogin()">
          <i class="fa-solid fa-key"></i> Open Station via PIN
        </button>
      </div>
    </div>
  </div>

  <!-- App Core & Firebase SDKs -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>

  <script>
    window.addEventListener('load', async () => {
      if (window.hk && hk.applyDark) hk.applyDark();
      await initFirebase();
      await waitForFB();
    });

    // 1. Email Login Function
    async function doctorEmailLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnEmailLogin');

      if (!email || !pass) return showToast('Enter email and password.', true);

      await waitForFB();
      if (!window._FB_READY) return showToast('Firebase not ready. Try again.', true);

      btn.disabled = true;
      try {
        const cred = await window._useAuth.signInWithEmailAndPassword(window._auth, email, pass);
        const uid = cred.user.uid;

        // Fetch Doctor Profile
        try {
          const docSnap = await window._fs.getDoc(window._fs.doc(window._db, 'doctors', uid));
          if (docSnap.exists()) {
            sessionStorage.setItem('activeDoctor', JSON.stringify(docSnap.data()));
          }
        } catch(e) {
          console.warn('Doc profile fetch error:', e);
        }

        showToast('Login successful!');
        setTimeout(() => { window.location.href = 'doctor.html'; }, 400);
      } catch (err) {
        showToast('Login Error: ' + (err.message || err.code), true, 4000);
      } finally {
        btn.disabled = false;
      }
    }

    // 2. Forgot Password Function
    async function handleForgotPassword() {
      const email = prompt('Enter your registered Doctor Email to receive the password reset link:');
      if (!email || !email.trim()) return;

      await waitForFB();
      if (!window._FB_READY) return showToast('Firebase not ready.', true);

      try {
        await window._useAuth.sendPasswordResetEmail(window._auth, email.trim());
        alert('Password reset link sent! Check your inbox or spam folder.');
      } catch (err) {
        showToast('Reset Error: ' + (err.message || err.code), true, 4000);
      }
    }

    // 3. Quick PIN Login Function
    async function doctorPinLogin() {
      const pin = document.getElementById('stationPin').value.trim();
      const btn = document.getElementById('btnPinLogin');

      if (pin.length !== 4) return showToast('Please enter a 4-digit PIN.', true);

      await waitForFB();
      if (!window._FB_READY) return showToast('Firebase not ready.', true);

      btn.disabled = true;
      try {
        const q = window._fs.query(
          window._fs.collection(window._db, 'doctors'),
          window._fs.where('pin', '==', pin),
          window._fs.limit(1)
        );
        const snap = await window._fs.getDocs(q);

        if (snap.empty) {
          return showToast('Invalid PIN. Check with hospital admin.', true);
        }

        const doctorData = snap.docs[0].data();
        sessionStorage.setItem('activeDoctor', JSON.stringify(doctorData));

        // Sign in anonymously if not logged in
        if (!window._auth.currentUser) {
          try {
            await window._useAuth.signInAnonymously(window._auth);
          } catch(e) {
            console.warn('Anon auth warning:', e);
          }
        }

        showToast('Access granted.');
        setTimeout(() => { window.location.href = 'doctor.html'; }, 400);
      } catch (err) {
        showToast('PIN Error: ' + (err.message || err.code), true, 4000);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
