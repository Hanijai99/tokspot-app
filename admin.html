<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Dashboard — TokSpot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    .admin-container { max-width: 900px; margin: 30px auto; padding: 0 16px 60px; }
    .page-title { font-size: 1.6rem; font-weight: 900; color: var(--ink); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
    @media(min-width: 600px) {
      .form-grid-2 { grid-template-columns: 1fr 1fr; }
    }
    .form-group label { display: block; font-size: 0.86rem; font-weight: 700; color: var(--slate-700); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); box-sizing: border-box; font-size: 0.95rem; }
    .form-control:focus { outline: none; border-color: var(--green); }
    .btn-submit { width: 100%; padding: 13px; font-size: 1rem; border-radius: 10px; font-weight: 800; cursor: pointer; border: none; }
    .pin-input { letter-spacing: 5px; font-weight: 800; font-size: 1.1rem; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png" alt="TokSpot" /></span>TokSpot
    </a>
    <span class="spacer"></span>
    <a href="doctor-login.html" class="btn btn-outline btn-sm" style="margin-right: 8px; text-decoration: none;">
      <i class="fa-solid fa-user-doctor"></i> Doctor Portal
    </a>
    <button class="icn-btn" onclick="hk.toggleDark()" title="Theme"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="admin-container">
    <div class="page-title">
      <i class="fa-solid fa-hospital-user" style="color: var(--green);"></i> Admin Console
    </div>

    <!-- 1. Provision Doctor Account Card -->
    <div class="card p-24">
      <h3 style="font-weight: 800; color: var(--ink); margin-bottom: 6px; font-size: 1.2rem;">
        <i class="fa-solid fa-user-plus" style="color: var(--green);"></i> Add New Doctor
      </h3>
      <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 16px;">
        Creates a Firebase user and automatically triggers a password-setup email link.
      </p>

      <div class="form-grid">
        <div class="form-group">
          <label>Doctor Full Name</label>
          <input type="text" id="newDocName" class="form-control" placeholder="e.g. Dr. Rajesh Kumar" required />
        </div>

        <div class="form-grid form-grid-2" style="margin-top: 0;">
          <div class="form-group">
            <label>Doctor Official Email</label>
            <input type="email" id="newDocEmail" class="form-control" placeholder="e.g. doctor@hospital.com" required />
          </div>
          <div class="form-group">
            <label>Station 4-Digit Quick PIN</label>
            <input type="password" maxlength="4" id="newDocPin" class="form-control pin-input" placeholder="••••" required />
          </div>
        </div>

        <div class="form-group">
          <label>Department / Specialty</label>
          <input type="text" id="newDocDept" class="form-control" placeholder="e.g. General Medicine / Pediatrics" />
        </div>
      </div>

      <button id="btnCreateDoc" class="btn btn-green btn-submit mt-16" onclick="adminRegisterDoctor()">
        <i class="fa-solid fa-plus-circle"></i> Provision Doctor Account
      </button>
    </div>

    <!-- 2. Existing Doctors Roster Card -->
    <div class="card p-24 mt-24">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="font-weight: 800; font-size: 1.15rem; color: var(--ink);">
          <i class="fa-solid fa-stethoscope" style="color: var(--mint-dark);"></i> Onboarded Doctors
        </h3>
        <button class="btn btn-outline btn-sm" onclick="fetchDoctorsList()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>

      <div id="doctorsListContainer" style="color: var(--slate-500); font-size: 0.9rem;">
        Loading doctor records...
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/app.js"></script>

  <script>
    // Initialize Primary App
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 1. Provision Doctor Account Logic
    async function adminRegisterDoctor() {
      const name = document.getElementById('newDocName').value.trim();
      const email = document.getElementById('newDocEmail').value.trim();
      const pin = document.getElementById('newDocPin').value.trim();
      const dept = document.getElementById('newDocDept').value.trim() || 'General';
      const btn = document.getElementById('btnCreateDoc');

      if (!name || !email || pin.length !== 4) {
        return alert("Please fill doctor name, valid email, and a 4-digit numeric PIN.");
      }

      const tempPassword = "Doc@" + Math.random().toString(36).slice(-8) + "!";
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Provisioning...';

      try {
        // Initialize or reuse Secondary App Instance so current Admin does not get signed out
        let secondaryApp;
        try {
          secondaryApp = firebase.app("DoctorProvisioner");
        } catch (e) {
          secondaryApp = firebase.initializeApp(firebaseConfig, "DoctorProvisioner");
        }

        // A. Create Authentication account
        const userCred = await secondaryApp.auth().createUserWithEmailAndPassword(email, tempPassword);
        const uid = userCred.user.uid;

        // B. Store Doctor Profile in Firestore
        await db.collection("doctors").doc(uid).set({
          uid: uid,
          name: name,
          email: email,
          pin: pin,
          department: dept,
          role: "doctor",
          status: "active",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // C. Send automated password setup email
        await firebase.auth().sendPasswordResetEmail(email);
        await secondaryApp.auth().signOut();

        alert(`Success! Account created for ${name}.\nA setup link has been emailed to ${email}.`);
        
        // Reset Inputs
        document.getElementById('newDocName').value = '';
        document.getElementById('newDocEmail').value = '';
        document.getElementById('newDocPin').value = '';
        document.getElementById('newDocDept').value = '';

        fetchDoctorsList();
      } catch (err) {
        console.error(err);
        alert("Registration failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Provision Doctor Account';
      }
    }

    // 2. Fetch and Display Active Doctors List
    async function fetchDoctorsList() {
      const container = document.getElementById('doctorsListContainer');
      try {
        const snap = await db.collection("doctors").orderBy("createdAt", "desc").limit(15).get();
        if (snap.empty) {
          container.innerHTML = '<p>No doctors registered yet.</p>';
          return;
        }

        let html = '<div style="display:flex; flex-direction:column; gap:10px;">';
        snap.forEach(doc => {
          const d = doc.data();
          html += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card);">
              <div>
                <strong style="color:var(--ink);">${d.name}</strong> 
                <span style="font-size:0.8rem; color:var(--slate-400); margin-left:6px;">(${d.department || 'General'})</span>
                <div style="font-size:0.82rem; color:var(--slate-500);">${d.email}</div>
              </div>
              <div style="text-align:right;">
                <span class="badge" style="background:var(--green-050); color:var(--green); padding:4px 8px; border-radius:6px; font-weight:700; font-size:0.8rem;">PIN: ${d.pin}</span>
              </div>
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      } catch (e) {
        console.warn("Could not load doctor roster:", e);
        container.innerHTML = '<p style="color:var(--slate-400);">Doctor list will show once records are added.</p>';
      }
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.hk && hk.applyDark) hk.applyDark();
      fetchDoctorsList();
    });
  </script>
</body>
</html>
