<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/loader.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Doctor Desk — TokMark</title>
  <link rel="stylesheet" href="css/style.css?v=20260930" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png?v=2" />
  <link rel="apple-touch-icon" href="logo.png?v=2" />
  <style>
    body { background: var(--night-bg); color: #f8fafc; min-height: 100vh; padding: 0; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .doc-container { max-width: 680px; margin: 0 auto; padding: 16px 20px 40px; }

    .doctor-badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1E5C50; border: 1px solid #334155; border-radius: 16px;
      padding: 14px 18px; margin-top: 14px;
    }
    
    .current-card { 
      background: #1E5C50; border-radius: 24px; padding: 28px 20px; 
      text-align: center; border: 1px solid #334155; margin-top: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35); position: relative;
    }
    .current-card.priority { border-color: #ef4444; background: linear-gradient(180deg, #2a1b1b, #1E5C50); }
    
    .curr-num { font-size: 5.5rem; font-weight: 900; color: #8BBB92; letter-spacing: -2px; line-height: 1; margin: 10px 0; }
    .curr-name { font-size: 1.35rem; font-weight: 700; color: #fff; }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
    .call-btn { 
      grid-column: span 3; height: 60px; font-size: 1.2rem; font-weight: 800; 
      background: #2A835F; border: none; border-radius: 14px; color: #fff; 
      display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
      box-shadow: 0 8px 24px rgba(42,131,95,0.3); transition: transform 0.15s;
    }
    .call-btn:active { transform: scale(0.98); }
    .sec-btn { height: 48px; font-size: 0.92rem; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-recall { background: #2A835F; color: #fff; }
    .btn-skip { background: #dc2626; color: #fff; }
    .btn-done { background: #2A835F; color: #fff; }
    
    .queue-list { background: #1E5C50; border-radius: 20px; padding: 18px; margin-top: 20px; border: 1px solid #334155; }
    .queue-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #334155; border-radius: 10px; }
    .queue-item:hover { background: #1E5C50; }
    .queue-item:last-child { border-bottom: none; }

    .note-box {
      width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155;
      border-radius: 12px; color: #fff; padding: 10px 14px; margin-top: 14px; font-size: 0.9rem;
      resize: none;
    }

    .hotkey-legend {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      font-size: 0.74rem; color: #94a3b8; margin-top: 12px;
    }
    .hotkey-legend kbd {
      background: #0f172a; color: #8BBB92; padding: 2px 6px; border-radius: 4px;
      font-weight: 800; border: 1px solid #334155; font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="topbar" style="background:#1E5C50;border-bottom:1px solid #334155;">
    <a class="brand" href="index.html" style="color:#8BBB92;">
      <span class="logomark"><img src="logo.png?v=2" alt="TokMark" /></span><span data-i18n="doctor.brand">TokMark Doctor</span>
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="doctorLogout()" title="Logout Station" data-i18n-title="doctor.logout"><i class="fa-solid fa-power-off"></i></button>
  </div>

  <div class="doc-container">

    <!-- Doctor Station Identity Bar -->
    <div class="doctor-badge-bar">
      <div>
        <div style="font-weight:800;font-size:1.1rem;color:#f8fafc;" id="docNameDisplay" data-i18n="doctor.loading">Loading Doctor…</div>
        <div style="font-size:0.82rem;color:#94a3b8;" id="hospNameDisplay">—</div>
      </div>
      <span class="badge green" id="stationStatusBadge" data-i18n="doctor.active">Active Desk</span>
      <button class="sec-btn" id="btnBreakToggle" onclick="toggleBreak()" style="display:none;background:#7c3aed;color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;"><i class="fa-solid fa-mug-hot"></i> <span id="btnBreakLabel" data-i18n="doctor.breakOn">Start Break</span></button>
    </div>

    <!-- Daily Token Limit (doctor self-service — change any time) -->
    <div class="limit-bar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:10px 14px;margin:12px 0;">
      <span style="font-size:.78rem;font-weight:800;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;"><i class="fa-solid fa-ticket"></i> <span data-i18n="doctor.dailyLimit.title">Daily Token Limit</span></span>
      <input type="number" id="dailyLimitInput" min="0" max="999" style="width:86px;padding:7px 10px;border-radius:8px;border:1px solid #334155;background:#0B1120;color:#f8fafc;font-weight:800;" placeholder="0" data-i18n-ph="doctor.dailyLimit.ph" />
      <span style="font-size:.8rem;color:#8BBB92;font-weight:700;" id="dailyLimitStatus"></span>
      <span class="spacer"></span>
      <button class="sec-btn" id="btnDailyLimit" onclick="saveDailyLimit()" style="background:#2A835F;color:#fff;border:none;padding:7px 14px;border-radius:8px;font-weight:800;cursor:pointer;"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="doctor.dailyLimit.save">Save Limit</span></button>
    </div>

    <!-- Active Consultation Card -->
    <div class="current-card" id="activeCard">
      <div style="font-size:0.82rem;text-transform:uppercase;color:#94a3b8;letter-spacing:1.5px;font-weight:700;" data-i18n="doctor.current">
        Currently In Room
      </div>
      <div class="curr-num" id="activeNumber">—</div>
      <div class="curr-name" id="activeName" data-i18n="doctor.waitNext">Waiting for next patient</div>
      <div id="activeMeta" style="color:#94a3b8;font-size:0.85rem;margin-top:4px;"></div>

      <!-- Fast Action Controls -->
      <div class="action-grid">
        <button class="call-btn" id="btnCallNext" onclick="callNext()"><i class="fa-solid fa-bullhorn"></i> <span data-i18n="doctor.callNext">Call Next Patient</span></button>
        <button class="sec-btn btn-recall" onclick="recallCurrent()"><i class="fa-solid fa-volume-high"></i> <span data-i18n="doctor.recall">Recall</span></button>
        <button class="sec-btn btn-skip" onclick="skipCurrent()"><i class="fa-solid fa-user-xmark"></i> <span data-i18n="doctor.skip">Absent / Skip</span></button>
        <button class="sec-btn btn-done" onclick="completeCurrent()"><i class="fa-solid fa-check-double"></i> <span data-i18n="doctor.complete">Complete</span></button>
      </div>

      <div class="hotkey-legend">
        <span><kbd>F4</kbd> <span data-i18n="doctor.hot.next">Next</span></span>
        <span><kbd>F8</kbd> <span data-i18n="doctor.hot.recall">Recall</span></span>
        <span><kbd>F9</kbd> <span data-i18n="doctor.hot.skip">Skip</span></span>
        <span><kbd>F10</kbd> <span data-i18n="doctor.hot.done">Done</span></span>
      </div>
    </div>

    <!-- Live Queue List -->
    <div class="queue-list">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 6px;">
        <span style="font-weight:800;color:#94a3b8;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;" data-i18n="doctor.waiting">Waiting In Queue</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span style="font-weight:800;color:#8BBB92;font-size:0.85rem;" id="waitEstimateChip"></span>
          <span style="font-weight:800;color:#8BBB92;font-size:0.85rem;" id="queueCount">0 Waiting</span>
        </span>
      </div>
      <div id="queueRows"></div>
    </div>
  </div>

  <audio id="docChime" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/queue-domain.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    if (window.I18N) I18N.init();
    function l10n(key, fb) { return (window.I18N && window.I18N.t) ? window.I18N.t(key) : fb; }
    window.escHtml = window.escHtml || function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };

    window.showToast = window.showToast || function(msg, isErr, ms) {
      let w = document.getElementById('hkToastWrap');
      if (!w) {
        w = document.createElement('div');
        w.id = 'hkToastWrap';
        w.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
        document.body.appendChild(w);
      }
      const t = document.createElement('div');
      t.style.cssText = `background:${isErr ? '#ef4444' : '#2A835F'};color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.9rem;box-shadow:0 10px 25px rgba(0,0,0,0.2);transition:opacity 0.3s;`;
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms || 2500);
    };

    let activeDoctorProfile = null;
    let currentHospitalSlug = null;
    let currentActiveToken = null;
    let waitingTokens = [];
    let unsubQueue = null;
    let unsubSecurity = null;
    let queuePollTimer = null;
    let doctorStats = null;
    let doctorOnBreak = false;
    const FUNC = window.TokSpotAPI && window.TokSpotAPI.mode() === 'functions';

    window.addEventListener('load', async () => {
      try {
        if (typeof initFirebase === 'function') await initFirebase();
        if (typeof waitForFB === 'function') await waitForFB();
      } catch (e) {
        console.error('Firebase init note:', e);
      }

      // Check doctor session
      const sessionData = sessionStorage.getItem('activeDoctor');
      if (!sessionData) {
        window.location.replace('doctor-login.html');
        return;
      }

      try {
        activeDoctorProfile = JSON.parse(sessionData);
      } catch(e) {
        sessionStorage.removeItem('activeDoctor');
        window.location.replace('doctor-login.html');
        return;
      }

      currentHospitalSlug = activeDoctorProfile.hospitalSlug;
      if (!currentHospitalSlug || !activeDoctorProfile.id) {
        window.location.replace('doctor-login.html');
        return;
      }

      const authUser = window._auth && window._auth.currentUser;
      // Functions mode requires a real Firebase Auth account linked to the
      // doctor (authUid). Prototype mode also accepts the doctor access
      // code + department station unlock (verified at login time).
      if (FUNC) {
        const viaCode = activeDoctorProfile.loggedInVia === 'code';
        if (!authUser || authUser.isAnonymous || viaCode) {
          sessionStorage.removeItem('activeDoctor');
          window.location.replace('doctor-login.html');
          return;
        }
      }

      try {
        const doctorRef = window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'doctors', activeDoctorProfile.id);
        const doctorSnap = await window._fs.getDoc(doctorRef);
        if (!doctorSnap.exists() || doctorSnap.data().status === 'revoked') {
          sessionStorage.removeItem('activeDoctor');
          window.location.replace('doctor-login.html');
          return;
        }
        if (FUNC && doctorSnap.data().authUid !== authUser.uid) {
          sessionStorage.removeItem('activeDoctor');
          window.location.replace('doctor-login.html');
          return;
        }
        activeDoctorProfile = { ...activeDoctorProfile, ...doctorSnap.data(), id: activeDoctorProfile.id, hospitalSlug: currentHospitalSlug };
      } catch (error) {
        console.error('Doctor role verification failed:', error);
        sessionStorage.removeItem('activeDoctor');
        window.location.replace('doctor-login.html');
        return;
      }

      // Populate doctor banner
      document.getElementById('docNameDisplay').textContent = activeDoctorProfile.name ? `Dr. ${activeDoctorProfile.name.replace(/^Dr\.?\s*/i, '')}` : l10n('doctor.tagline', 'Doctor Desk');
      document.getElementById('hospNameDisplay').textContent = `${activeDoctorProfile.hospitalName || currentHospitalSlug} · ${activeDoctorProfile.department || l10n('doctor.room', 'Consultation Room')}`;

      // Break state (from the live doctor doc merged into the profile)
      doctorOnBreak = Boolean(activeDoctorProfile.onBreak);
      refreshBreakUI();

      // Daily token limit control (doctor self-service — change any time)
      const limInput = document.getElementById('dailyLimitInput');
      if (limInput) limInput.value = activeDoctorProfile.dailyLimit || 0;
      refreshDailyLimitStatus();

      // Start Security Listener & Queue Listener
      listenDoctorSecurity();
      listenDoctorQueue();
    });

    // Real-Time Doctor Security Guard (Instant Revocation Listener)
    function listenDoctorSecurity() {
      if (unsubSecurity) unsubSecurity();
      
      const docRef = window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'doctors', activeDoctorProfile.id);
      unsubSecurity = window._fs.onSnapshot(docRef, (docSnap) => {
        // If document was deleted by admin or access status marked revoked
        if (!docSnap.exists() || docSnap.data().status === 'revoked') {
          if (unsubQueue) unsubQueue();
          if (unsubSecurity) unsubSecurity();
          sessionStorage.clear();
          localStorage.removeItem('tokmark_doctor_id');
          alert(l10n('doctor.accessRevoked', 'ACCESS REVOKED: Your credentials have been decoupled from this hospital by the administrator. You are now logged out.'));
          window.location.replace('doctor-login.html');
        }
        // Live break-state sync (admin or another desk set it)
        const onBreak = Boolean(docSnap.data().onBreak);
        if (onBreak !== doctorOnBreak) {
          doctorOnBreak = onBreak;
          refreshBreakUI();
        }
      }, (err) => {
        console.warn('Security watcher note:', err);
      });
    }

    // ---- Daily token limit (doctor self-service) ----
    function refreshDailyLimitStatus() {
      const n = Number(activeDoctorProfile.dailyLimit || 0);
      const status = document.getElementById('dailyLimitStatus');
      if (status) {
        status.textContent = n > 0
          ? l10n('doctor.dailyLimit.count', 'Max %s patients/day').replace('%s', n)
          : l10n('doctor.dailyLimit.unlimited', 'Unlimited');
      }
    }

    async function saveDailyLimit() {
      const input = document.getElementById('dailyLimitInput');
      const n = Math.floor(Number(String(input.value || '').trim()));
      if (!Number.isFinite(n) || n < 0 || n > 999) {
        return showToast(l10n('doctor.dailyLimit.err', 'Enter a number between 0 and 999 (0 = unlimited).'), true);
      }
      const btn = document.getElementById('btnDailyLimit');
      if (btn) btn.disabled = true;
      try {
        await window.TokSpotAPI.setDoctorDailyLimit({ slug: currentHospitalSlug, doctorId: activeDoctorProfile.id, dailyLimit: n });
        activeDoctorProfile.dailyLimit = n;
        refreshDailyLimitStatus();
        showToast(l10n('doctor.dailyLimit.saved', 'Daily token limit updated.'));
      } catch (e) {
        showToast(l10n('doctor.dailyLimit.err', 'Could not update limit: ') + e.message, true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function toggleBreak() {
      const next = !doctorOnBreak;
      let note = '';
      if (next) {
        try {
          note = window.prompt(l10n('doctor.breakPrompt', 'Break note (shown on TV board, optional):')) || '';
        } catch (e) { note = ''; }
        note = String(note).slice(0, 200);
        if (note && !confirm(l10n('doctor.breakConfirm', 'Mark yourself On Break'))) return;
      }
      const was = doctorOnBreak;
      doctorOnBreak = next;
      refreshBreakUI();
      const request = async () => {
        if (FUNC) {
          await window.TokSpotAPI.setDoctorBreak({
            slug: currentHospitalSlug,
            doctorId: activeDoctorProfile.id,
            onBreak: next,
            breakNote: next ? note : '',
          });
        } else {
          await window._fs.updateDoc(
            window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'doctors', activeDoctorProfile.id),
            { onBreak: next, breakNote: next ? note : '', breakUpdatedAt: new Date().toISOString() }
          );
        }
      };
      request().then(() => showToast(next ? l10n('doctor.breakToastOn', 'On break — TV board updated') : l10n('doctor.breakToastOff', 'Back online'))).catch((e) => {
        doctorOnBreak = was;
        refreshBreakUI();
        showToast(l10n('doctor.breakErr', 'Break toggle failed: ') + e.message, true);
      });
    }

    function getRoomCounterName() {
      if (!activeDoctorProfile) return l10n('doctor.room', 'Consultation Room');
      return activeDoctorProfile.room || activeDoctorProfile.counter || activeDoctorProfile.department || l10n('doctor.room', 'Consultation Room');
    }

    function listenDoctorQueue() {
      if (FUNC) { startDoctorQueuePolling(); return; }
      if (unsubQueue) unsubQueue();
      const today = window.todayStr ? window.todayStr() : new Date().toISOString().slice(0, 10);

      const tokensRef = window._fs.collection(window._db, 'hospitals', currentHospitalSlug, 'tokens');
      const q = window._fs.query(tokensRef, window._fs.where('date', '==', today));

      unsubQueue = window._fs.onSnapshot(q, (snap) => {
        waitingTokens = [];
        currentActiveToken = null;

        snap.docs.forEach(d => {
          const t = d.data();
          t.id = d.id;

          const matchesDoctor = String(t.doctorId) === String(activeDoctorProfile.id) || !t.doctorId;

          if (matchesDoctor) {
            if (t.status === 'called' || t.status === 'in-consultation') {
              currentActiveToken = t;
            } else if (t.status === 'waiting') {
              waitingTokens.push(t);
            }
          }
        });

        waitingTokens.sort((a, b) => {
          if (b.priority && !a.priority) return 1;
          if (!b.priority && a.priority) return -1;
          return (Number(a.number) || 0) - (Number(b.number) || 0);
        });

        document.getElementById('queueCount').textContent = `${waitingTokens.length} ${l10n('doctor.waitCount', 'Waiting')}`;

        const card = document.getElementById('activeCard');
        if (currentActiveToken) {
          document.getElementById('activeNumber').textContent = `#${currentActiveToken.number}`;
          document.getElementById('activeName').textContent = currentActiveToken.patientName || l10n('doctor.patient', 'Patient');
          document.getElementById('activeMeta').textContent = `${l10n('doctor.phone', 'Phone: %s').replace('%s', currentActiveToken.phone || 'N/A')} · ${l10n('doctor.source', 'Source: %s').replace('%s', currentActiveToken.source || 'Desk')}`;
          card.classList.toggle('priority', !!currentActiveToken.priority);
        } else {
          document.getElementById('activeNumber').textContent = '—';
          document.getElementById('activeName').textContent = l10n('doctor.waitNext', 'Waiting for next patient');
          document.getElementById('activeMeta').textContent = '';
          card.classList.remove('priority');
        }

        finalizeDoctorQueue();
      }, (err) => {
        console.error('Queue snapshot error:', err);
        showToast(l10n('doctor.err.sync', 'Error syncing queue: ') + err.message, true);
      });
    }

    // Shared render step for both snapshot (prototype) and polled
    // (functions) queue data.
    function refreshBreakUI() {
      const badge = document.getElementById('stationStatusBadge');
      const btn = document.getElementById('btnBreakToggle');
      const label = document.getElementById('btnBreakLabel');
      const t = (key, fb) => (window.I18N ? window.I18N.t(key) : fb);
      if (btn) {
        btn.style.display = 'inline-flex';
        label.textContent = doctorOnBreak ? t('doctor.breakOff', 'Resume') : t('doctor.breakOn', 'Start Break');
      }
      if (badge) {
        badge.textContent = doctorOnBreak ? t('doctor.onBreak', 'On Break') : t('doctor.active', 'Active Desk');
        badge.className = 'badge ' + (doctorOnBreak ? 'amber' : 'green');
      }
    }

    function renderQueueMeta() {
      const n = waitingTokens.length;
      const chip = document.getElementById('waitEstimateChip');
      if (chip) {
        let ewt = null;
        if (doctorStats && Number.isFinite(doctorStats.waitEstimateMinutes)) {
          ewt = doctorStats.waitEstimateMinutes;
        } else if (!FUNC && window.TokspotQueue) {
          const served = waitingTokens.concat(currentActiveToken ? [currentActiveToken] : []).filter((t) => t.calledAt && t.createdAt && t.status !== 'waiting');
          const avg = window.TokspotQueue.averageWaitMinutes(served);
          ewt = window.TokspotQueue.estimateWaitMinutes({ waitingCount: n, avgServeMinutes: avg });
        }
        chip.textContent = (ewt !== null && ewt > 0) ? l10n('display.waitChip', `~${ewt} min wait`).replace('%s', ewt) : '';
        chip.style.color = ewt && ewt > 10 ? '#fbbf24' : '#8BBB92';
      }
      document.getElementById('queueCount').textContent = `${n} ${l10n('doctor.waitCount', 'Waiting')}`;
    }

    function finalizeDoctorQueue() {
      waitingTokens.sort((a, b) => {
        if (b.priority && !a.priority) return 1;
        if (!b.priority && a.priority) return -1;
        return (Number(a.number) || 0) - (Number(b.number) || 0);
      });

      document.getElementById('queueCount').textContent = `${waitingTokens.length} ${l10n('doctor.waitCount', 'Waiting')}`;

      const card = document.getElementById('activeCard');
      if (currentActiveToken) {
        document.getElementById('activeNumber').textContent = `#${currentActiveToken.number}`;
        document.getElementById('activeName').textContent = currentActiveToken.patientName || l10n('doctor.patient', 'Patient');
        document.getElementById('activeMeta').textContent = `${l10n('doctor.phone', 'Phone: %s').replace('%s', currentActiveToken.phone || 'N/A')} · ${l10n('doctor.source', 'Source: %s').replace('%s', currentActiveToken.source || 'Desk')}`;
        card.classList.toggle('priority', !!currentActiveToken.priority);
      } else {
        document.getElementById('activeNumber').textContent = '—';
        document.getElementById('activeName').textContent = l10n('doctor.waitNext', 'Waiting for next patient');
        document.getElementById('activeMeta').textContent = '';
        card.classList.remove('priority');
      }

      renderQueueRows();
      refreshBreakUI();
      renderQueueMeta();
    }
    // token reads — the target rules deny those for doctor roles).
    function startDoctorQueuePolling() {
      if (unsubQueue) { unsubQueue(); unsubQueue = null; }
      const tick = async () => {
        try {
          const res = await window.TokSpotAPI.getDoctorQueue({
            slug: currentHospitalSlug,
            doctorId: activeDoctorProfile.id,
          });
          doctorStats = res.stats || null;
          waitingTokens = [];
          currentActiveToken = null;
          (res.rows || []).forEach((t) => {
            if (t.status === 'called') currentActiveToken = t;
            else if (t.status === 'waiting') waitingTokens.push(t);
          });
          finalizeDoctorQueue();
        } catch (e) {
          console.error('Queue poll error:', e);
          showToast(l10n('doctor.err.sync', 'Error syncing queue: ') + e.message, true);
        }
      };
      tick();
      if (queuePollTimer) clearInterval(queuePollTimer);
      queuePollTimer = setInterval(tick, 3000);
    }

    function renderQueueRows() {
      const container = document.getElementById('queueRows');
      if (!waitingTokens.length) {
        container.innerHTML = `<div style="padding:18px;text-align:center;color:#64748b;">${l10n('doctor.empty', 'No patients waiting in queue')}</div>`;
        return;
      }

      container.innerHTML = waitingTokens.map((t, idx) => `
        <div class="queue-item">
          <div>
            <span style="font-weight:800;color:#8BBB92;font-size:1.15rem;margin-right:10px;">#${escHtml(t.number)}</span>
            <span style="color:#cbd5e1;font-weight:600;font-size:0.95rem;">${escHtml(t.patientName || l10n('doctor.patient', 'Patient'))}</span>
            ${t.priority ? `<span class="badge red" style="margin-left:6px;"><i class="fa-solid fa-truck-medical"></i> ${l10n('doctor.priority', 'PRIORITY')}</span>` : ''}
          </div>
          <span style="color:#64748b;font-size:0.85rem;font-weight:700;">${l10n('doctor.pos', 'Pos')} ${idx + 1}</span>
        </div>
      `).join('');
    }

    async function callNext() {
      if (!waitingTokens.length) return showToast(l10n('doctor.err.noWait', 'No waiting patients in queue.'), true);

      const btn = document.getElementById('btnCallNext');
      btn.disabled = true;

      try {
        if (currentActiveToken) {
          await window.TokSpotAPI.transition({ slug: currentHospitalSlug, tokenId: currentActiveToken.id, nextStatus: 'completed' });
        }

        const nextToken = waitingTokens[0];
        const roomName = getRoomCounterName();

        await window.TokSpotAPI.transition({
          slug: currentHospitalSlug,
          tokenId: nextToken.id,
          nextStatus: 'called',
          changes: {
            doctorId: activeDoctorProfile.id,
            doctorName: activeDoctorProfile.name || '',
            counter: roomName
          }
        });

        playChime();
        if (window.announceToken) {
          window.announceToken(nextToken.number, nextToken.patientName, roomName);
        }
        showToast(l10n('doctor.ok.calling', 'Calling Token #%s').replace('%s', nextToken.number));
      } catch (e) {
        showToast(l10n('doctor.err.call', 'Call failed: ') + e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function recallCurrent() {
      if (!currentActiveToken) return showToast(l10n('doctor.err.noActiveRecall', 'No active patient to recall.'), true);
      playChime();
      const roomName = getRoomCounterName();
      if (window.announceToken) {
        window.announceToken(currentActiveToken.number, currentActiveToken.patientName, roomName);
      }
      showToast(l10n('doctor.ok.recalled', 'Recalled Token #%s').replace('%s', currentActiveToken.number));
    }

    async function skipCurrent() {
      if (!currentActiveToken) return showToast(l10n('doctor.err.noActiveSkip', 'No active patient to skip.'), true);
      try {
        await window.TokSpotAPI.transition({ slug: currentHospitalSlug, tokenId: currentActiveToken.id, nextStatus: 'skipped' });
        showToast(l10n('doctor.ok.absent', 'Token #%s marked Absent.').replace('%s', currentActiveToken.number));
      } catch (e) {
        showToast(l10n('doctor.err.skip', 'Skip failed: ') + e.message, true);
      }
    }

    async function completeCurrent() {
      if (!currentActiveToken) return showToast(l10n('doctor.err.noActive', 'No active patient.'), true);
      try {
        await window.TokSpotAPI.transition({ slug: currentHospitalSlug, tokenId: currentActiveToken.id, nextStatus: 'completed' });
        showToast(l10n('doctor.ok.completed', 'Token #%s consultation completed.').replace('%s', currentActiveToken.number));
      } catch (e) {
        showToast(l10n('doctor.err.action', 'Action failed: ') + e.message, true);
      }
    }

    function playChime() {
      try {
        const audio = document.getElementById('docChime');
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function doctorLogout() {
      if (!confirm(l10n('doctor.confirm.logout', 'Sign out from Doctor Desk?'))) return;
      sessionStorage.removeItem('activeDoctor');
      if (unsubQueue) unsubQueue();
      if (unsubSecurity) unsubSecurity();
      window.location.replace('doctor-login.html');
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT')) return;

      if (e.key === 'F4') { e.preventDefault(); callNext(); }
      if (e.key === 'F8') { e.preventDefault(); recallCurrent(); }
      if (e.key === 'F9') { e.preventDefault(); skipCurrent(); }
      if (e.key === 'F10') { e.preventDefault(); completeCurrent(); }
    });
  </script>
</body>
</html>
