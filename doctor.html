<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Doctor Desk — TokSpot</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 0; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .doc-container { max-width: 680px; margin: 0 auto; padding: 16px 20px 40px; }

    .doctor-badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 14px 18px; margin-top: 14px;
    }
    
    .current-card { 
      background: #1e293b; border-radius: 24px; padding: 28px 20px; 
      text-align: center; border: 1px solid #334155; margin-top: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35); position: relative;
    }
    .current-card.priority { border-color: #ef4444; background: linear-gradient(180deg, #2a1b1b, #1e293b); }
    
    .curr-num { font-size: 5.5rem; font-weight: 900; color: #38bdf8; letter-spacing: -2px; line-height: 1; margin: 10px 0; }
    .curr-name { font-size: 1.35rem; font-weight: 700; color: #fff; }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
    .call-btn { 
      grid-column: span 3; height: 60px; font-size: 1.2rem; font-weight: 800; 
      background: #16a34a; border: none; border-radius: 14px; color: #fff; 
      display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
      box-shadow: 0 8px 24px rgba(22,163,74,0.3); transition: transform 0.15s;
    }
    .call-btn:active { transform: scale(0.98); }
    .sec-btn { height: 48px; font-size: 0.92rem; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-recall { background: #0d9488; color: #fff; }
    .btn-skip { background: #dc2626; color: #fff; }
    .btn-done { background: #0284c7; color: #fff; }
    
    .queue-list { background: #1e293b; border-radius: 20px; padding: 18px; margin-top: 20px; border: 1px solid #334155; }
    .queue-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #334155; border-radius: 10px; }
    .queue-item:hover { background: #24314a; }
    .queue-item:last-child { border-bottom: none; }

    .note-box {
      width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155;
      border-radius: 12px; color: #fff; padding: 10px 14px; margin-top: 14px; font-size: 0.9rem;
      resize: none;
    }

    .hotkey-legend {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      font-size: 0.74rem; color: #94a3b8; margin-top: 12px;
    }
    .hotkey-legend kbd {
      background: #0f172a; color: #38bdf8; padding: 2px 6px; border-radius: 4px;
      font-weight: 800; border: 1px solid #334155; font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="topbar" style="background:#1e293b;border-bottom:1px solid #334155;">
    <a class="brand" href="index.html" style="color:#38bdf8;">
      <span class="logomark"><img src="logo.png" alt="TokSpot" /></span>TokSpot Doctor
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="doctorLogout()" title="Logout Station"><i class="fa-solid fa-power-off"></i></button>
  </div>

  <div class="doc-container">

    <!-- Doctor Station Identity Bar -->
    <div class="doctor-badge-bar">
      <div>
        <div style="font-weight:800;font-size:1.1rem;color:#f8fafc;" id="docNameDisplay">Loading Doctor…</div>
        <div style="font-size:0.82rem;color:#94a3b8;" id="hospNameDisplay">—</div>
      </div>
      <span class="badge green" id="stationStatusBadge">Active Desk</span>
    </div>

    <!-- Active Consultation Card -->
    <div class="current-card" id="activeCard">
      <div style="font-size:0.82rem;text-transform:uppercase;color:#94a3b8;letter-spacing:1.5px;font-weight:700;">
        Currently In Room
      </div>
      <div class="curr-num" id="activeNumber">—</div>
      <div class="curr-name" id="activeName">Waiting for next patient</div>
      <div id="activeMeta" style="color:#94a3b8;font-size:0.85rem;margin-top:4px;"></div>

      <textarea id="consultNotes" class="note-box" rows="2" placeholder="Prescription / Quick consultation notes (Optional)..."></textarea>

      <!-- Fast Action Controls -->
      <div class="action-grid">
        <button class="call-btn" id="btnCallNext" onclick="callNext()"><i class="fa-solid fa-bullhorn"></i> Call Next Patient</button>
        <button class="sec-btn btn-recall" onclick="recallCurrent()"><i class="fa-solid fa-volume-high"></i> Recall</button>
        <button class="sec-btn btn-skip" onclick="skipCurrent()"><i class="fa-solid fa-user-xmark"></i> Absent / Skip</button>
        <button class="sec-btn btn-done" onclick="completeCurrent()"><i class="fa-solid fa-check-double"></i> Complete</button>
      </div>

      <div class="hotkey-legend">
        <span><kbd>F4</kbd> Next</span>
        <span><kbd>F8</kbd> Recall</span>
        <span><kbd>F9</kbd> Skip</span>
        <span><kbd>F10</kbd> Done</span>
      </div>
    </div>

    <!-- Live Queue List -->
    <div class="queue-list">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 6px;">
        <span style="font-weight:800;color:#94a3b8;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;">Waiting In Queue</span>
        <span style="font-weight:800;color:#38bdf8;font-size:0.85rem;" id="queueCount">0 Waiting</span>
      </div>
      <div id="queueRows"></div>
    </div>
  </div>

  <audio id="docChime" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    // Failsafe HTML escape
    window.escHtml = window.escHtml || function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };

    // Failsafe toast
    window.showToast = window.showToast || function(msg, isErr, ms) {
      let w = document.getElementById('hkToastWrap');
      if (!w) {
        w = document.createElement('div');
        w.id = 'hkToastWrap';
        w.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
        document.body.appendChild(w);
      }
      const t = document.createElement('div');
      t.style.cssText = `background:${isErr ? '#ef4444' : '#16a34a'};color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.9rem;box-shadow:0 10px 25px rgba(0,0,0,0.2);transition:opacity 0.3s;`;
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms || 2500);
    };

    let activeDoctorProfile = null;
    let currentHospitalSlug = null;
    let currentActiveToken = null;
    let waitingTokens = [];
    let unsubQueue = null;

    window.addEventListener('load', async () => {
      try {
        if (typeof initFirebase === 'function') await initFirebase();
        if (typeof waitForFB === 'function') await waitForFB();
      } catch (e) {
        console.error('Firebase init note:', e);
      }

      // Check doctor session
      const sessionData = sessionStorage.getItem('activeDoctor');
      if (!sessionData) {
        window.location.replace('doctor-login.html');
        return;
      }

      try {
        activeDoctorProfile = JSON.parse(sessionData);
      } catch(e) {
        sessionStorage.removeItem('activeDoctor');
        window.location.replace('doctor-login.html');
        return;
      }

      currentHospitalSlug = activeDoctorProfile.hospitalSlug;
      if (!currentHospitalSlug || !activeDoctorProfile.id) {
        window.location.replace('doctor-login.html');
        return;
      }

      // Populate doctor banner
      document.getElementById('docNameDisplay').textContent = activeDoctorProfile.name ? `Dr. ${activeDoctorProfile.name.replace(/^Dr\.?\s*/i, '')}` : 'Doctor Desk';
      document.getElementById('hospNameDisplay').textContent = `${activeDoctorProfile.hospitalName || currentHospitalSlug} · ${activeDoctorProfile.department || 'Consultation Room'}`;

      listenDoctorQueue();
    });

    function getRoomCounterName() {
      if (!activeDoctorProfile) return 'Consultation Room';
      return activeDoctorProfile.room || activeDoctorProfile.counter || activeDoctorProfile.department || 'Consultation Room';
    }

    function listenDoctorQueue() {
      if (unsubQueue) unsubQueue();
      const today = window.todayStr ? window.todayStr() : new Date().toISOString().slice(0, 10);

      // Robust listener query
      const tokensRef = window._fs.collection(window._db, 'hospitals', currentHospitalSlug, 'tokens');
      const q = window._fs.query(tokensRef, window._fs.where('date', '==', today));

      unsubQueue = window._fs.onSnapshot(q, (snap) => {
        waitingTokens = [];
        currentActiveToken = null;

        snap.docs.forEach(d => {
          const t = d.data();
          t.id = d.id;

          // Check if token belongs to this doctor OR if token has no doctor assigned yet
          const matchesDoctor = String(t.doctorId) === String(activeDoctorProfile.id) || !t.doctorId;

          if (matchesDoctor) {
            if (t.status === 'called' || t.status === 'in-consultation') {
              currentActiveToken = t;
            } else if (t.status === 'waiting') {
              waitingTokens.push(t);
            }
          }
        });

        // Numeric natural sorting (Token 1, 2, ..., 10, 11) + Priority handling
        waitingTokens.sort((a, b) => {
          if (b.priority && !a.priority) return 1;
          if (!b.priority && a.priority) return -1;
          return (Number(a.number) || 0) - (Number(b.number) || 0);
        });

        document.getElementById('queueCount').textContent = `${waitingTokens.length} Waiting`;

        const card = document.getElementById('activeCard');
        if (currentActiveToken) {
          document.getElementById('activeNumber').textContent = `#${currentActiveToken.number}`;
          document.getElementById('activeName').textContent = currentActiveToken.patientName || 'Patient';
          document.getElementById('activeMeta').textContent = `Phone: ${currentActiveToken.phone || 'N/A'} · Source: ${currentActiveToken.source || 'Desk'}`;
          card.classList.toggle('priority', !!currentActiveToken.priority);
        } else {
          document.getElementById('activeNumber').textContent = '—';
          document.getElementById('activeName').textContent = 'Waiting for next patient';
          document.getElementById('activeMeta').textContent = '';
          card.classList.remove('priority');
        }

        renderQueueRows();
      }, (err) => {
        console.error('Queue snapshot error:', err);
        showToast('Error syncing queue: ' + err.message, true);
      });
    }

    function renderQueueRows() {
      const container = document.getElementById('queueRows');
      if (!waitingTokens.length) {
        container.innerHTML = '<div style="padding:18px;text-align:center;color:#64748b;">No patients waiting in queue</div>';
        return;
      }

      container.innerHTML = waitingTokens.map((t, idx) => `
        <div class="queue-item">
          <div>
            <span style="font-weight:800;color:#38bdf8;font-size:1.15rem;margin-right:10px;">#${escHtml(t.number)}</span>
            <span style="color:#cbd5e1;font-weight:600;font-size:0.95rem;">${escHtml(t.patientName || 'Patient')}</span>
            ${t.priority ? '<span class="badge red" style="margin-left:6px;"><i class="fa-solid fa-truck-medical"></i> PRIORITY</span>' : ''}
          </div>
          <span style="color:#64748b;font-size:0.85rem;font-weight:700;">Pos ${idx + 1}</span>
        </div>
      `).join('');
    }

    async function callNext() {
      if (!waitingTokens.length) return showToast('No waiting patients in queue.', true);

      const btn = document.getElementById('btnCallNext');
      btn.disabled = true;

      try {
        // Auto-complete previous token if still in room
        if (currentActiveToken) {
          const notes = document.getElementById('consultNotes').value.trim();
          await window._fs.updateDoc(window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'tokens', currentActiveToken.id), {
            status: 'completed',
            doctorNotes: notes || '',
            completedAt: window._fs.serverTimestamp()
          });
          document.getElementById('consultNotes').value = '';
        }

        const nextToken = waitingTokens[0];
        const roomName = getRoomCounterName();

        await window._fs.updateDoc(window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'tokens', nextToken.id), {
          status: 'called',
          doctorId: activeDoctorProfile.id,
          doctorName: activeDoctorProfile.name || '',
          counter: roomName,
          calledAt: window._fs.serverTimestamp()
        });

        playChime();
        if (window.announceToken) {
          window.announceToken(nextToken.number, nextToken.patientName, roomName);
        }
        showToast(`Calling Token #${nextToken.number}`);
      } catch (e) {
        showToast('Call failed: ' + e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function recallCurrent() {
      if (!currentActiveToken) return showToast('No active patient to recall.', true);
      playChime();
      const roomName = getRoomCounterName();
      if (window.announceToken) {
        window.announceToken(currentActiveToken.number, currentActiveToken.patientName, roomName);
      }
      showToast(`Recalled Token #${currentActiveToken.number}`);
    }

    async function skipCurrent() {
      if (!currentActiveToken) return showToast('No active patient to skip.', true);
      try {
        await window._fs.updateDoc(window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'tokens', currentActiveToken.id), {
          status: 'skipped',
          skippedAt: window._fs.serverTimestamp()
        });
        document.getElementById('consultNotes').value = '';
        showToast(`Token #${currentActiveToken.number} marked Absent.`);
      } catch (e) {
        showToast('Skip failed: ' + e.message, true);
      }
    }

    async function completeCurrent() {
      if (!currentActiveToken) return showToast('No active patient.', true);
      const notes = document.getElementById('consultNotes').value.trim();
      try {
        await window._fs.updateDoc(window._fs.doc(window._db, 'hospitals', currentHospitalSlug, 'tokens', currentActiveToken.id), {
          status: 'completed',
          doctorNotes: notes || '',
          completedAt: window._fs.serverTimestamp()
        });
        document.getElementById('consultNotes').value = '';
        showToast(`Token #${currentActiveToken.number} consultation completed.`);
      } catch (e) {
        showToast('Action failed: ' + e.message, true);
      }
    }

    function playChime() {
      try {
        const audio = document.getElementById('docChime');
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function doctorLogout() {
      if (!confirm('Sign out from Doctor Desk?')) return;
      sessionStorage.removeItem('activeDoctor');
      if (unsubQueue) unsubQueue();
      window.location.replace('doctor-login.html');
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT')) return;

      if (e.key === 'F4') { e.preventDefault(); callNext(); }
      if (e.key === 'F8') { e.preventDefault(); recallCurrent(); }
      if (e.key === 'F9') { e.preventDefault(); skipCurrent(); }
      if (e.key === 'F10') { e.preventDefault(); completeCurrent(); }
    });
  </script>
</body>
</html>
