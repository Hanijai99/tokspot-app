<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/loader.js?v=20261002"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Book Token — TokSpot</title>
  <link rel="stylesheet" href="css/style.css?v=20261001" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <style>
    body { background: var(--day-bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; }
    .book-container { max-width: 480px; margin: 30px auto; padding: 0 16px; }
    .step-card {
      background: #ffffff; border: 1px solid var(--line); border-radius: 20px;
      padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .badge-code {
      background: #E4F3EA; color: #1F6B4C; font-weight: 800;
      padding: 4px 10px; border-radius: 8px; font-size: 0.85rem;
    }
    .doc-radio {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
      margin-bottom: 10px; transition: border-color .2s, background .2s;
    }
    .doc-radio.selected { border-color: var(--green); background: #ECF6EF; }
    .doc-radio input { display: none; }

    /* Smart Search Dropdown Styles */
    .search-wrapper { position: relative; }
    .search-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; background: #ffffff;
      border: 1px solid var(--line); border-radius: 12px; margin-top: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 240px; overflow-y: auto; z-index: 50;
    }
    .search-item {
      padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
      transition: background 0.2s;
    }
    .search-item:hover { background: #f1f5f9; }
    .search-item:last-child { border-bottom: none; }
    
    body.dark { background: var(--night-bg); }
    body.dark .step-card { background: #12544F; border-color: #1E5C50; }
    body.dark .doc-radio { border-color: #1E5C50; background: #0f172a; }
    body.dark .doc-radio.selected { border-color: var(--green); background: #12544F; }
    body.dark .search-dropdown { background: #1E5C50; border-color: #334155; }
    body.dark .search-item { border-color: #334155; }
    body.dark .search-item:hover { background: #0f172a; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png" alt="" /></span>TokSpot
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="hk.toggleDark()"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="book-container">

    <!-- STEP 1: Search Hospital Name or Enter Code -->
    <div class="step-card" id="stepCode">
      <div style="font-weight: 800; font-size: 1.2rem; margin-bottom: 6px;">
        <i class="fa-solid fa-hospital" style="color:var(--green);margin-right:8px;"></i> <span data-i18n="book.find">Find Your Hospital</span>
      </div>
      <div class="muted" style="font-size: 0.88rem; margin-bottom: 16px;" data-i18n="book.find.sub">
        Search by Hospital Name, City, or enter your 4-digit booking code.
      </div>

      <!-- In-app appointment reminder (today / tomorrow) -->
      <div class="hidden" id="myApptReminder" style="margin-bottom:16px;border:1px solid var(--green);background:#ECF6EF;border-radius:12px;padding:10px 14px;font-size:.85rem;font-weight:700;color:#0f766e;"></div>
      
      <div class="search-wrapper">
        <input class="input" id="hospitalSearchInput" type="text" placeholder="e.g. Apollo or HOSP-1234" autocomplete="off" oninput="handleSearch()" style="font-weight:700; padding:14px 16px;" data-i18n-ph="book.search.ph" />
        <div id="searchLoader" class="hidden" style="position:absolute;right:14px;top:16px;color:var(--slate-400);"><i class="fa-solid fa-spinner fa-spin"></i></div>
        <div id="searchResults" class="search-dropdown hidden"></div>
      </div>

      <div id="directLookupBtn" class="mt-12 hidden">
        <button class="btn btn-slate btn-block btn-sm" onclick="forceDirectLookup()"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="code.direct">Direct Lookup Code</span></button>
      </div>
    </div>

    <!-- STEP 2: Choose Doctor & Enter Patient Details -->
    <div class="step-card hidden" id="stepDetails">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px dashed var(--line); padding-bottom:12px;">
        <div>
          <div style="font-weight: 800; font-size: 1.1rem; color:var(--ink);" id="dispHospitalName">—</div>
          <div class="muted" style="font-size: 0.82rem;" id="dispHospitalCity">—</div>
        </div>
        <span class="badge-code" id="dispCodeTag">CODE</span>
      </div>

      <!-- Select Doctor -->
      <div class="field">
        <label class="label"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="book.step.doctor">Select Consultation Doctor</span></label>
        <div id="doctorOptionsList" style="margin-top: 8px;"></div>
      </div>

      <!-- Advanced Appointment (optional) -->
      <div class="field mt-16">
        <label class="label"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="book.appt.title">Book Advanced Appointment</span> <span class="muted" style="font-weight:600;font-size:.78rem;" data-i18n="book.appt.sub">(optional — skip for a walk-in token)</span></label>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;" id="apptDateRow"></div>
        <div id="apptSlotsWrap" class="hidden" style="margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;">
          <div class="muted" style="font-size:.8rem;margin-bottom:8px;"><span data-i18n="book.appt.pick">Pick a time slot</span> (<span id="apptSlotsDateLabel">—</span>)</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;" id="apptSlotsRow"><div class="muted" style="font-size:.8rem;"><span data-i18n="book.slots.loading">Loading slots…</span></div></div>
        </div>
      </div>

      <!-- Patient Information -->
      <div class="field mt-16">
        <label class="label"><span data-i18n="book.step.name">Patient Full Name</span> <span class="req">*</span></label>
        <input class="input" id="patName" type="text" placeholder="e.g. Rahul Sharma" data-i18n-ph="book.name.ph" />
      </div>

      <div class="field">
        <label class="label"><span data-i18n="book.step.phone">Mobile Number</span> <span class="req">*</span> <span class="muted" data-i18n="book.step.phone.sub">(for live queue alerts)</span></label>
        <input class="input" id="patPhone" type="tel" maxlength="10" placeholder="10-digit mobile number" data-i18n-ph="book.phone.ph" />

        <label class="label" style="margin-top:12px;"><i class="fa-solid fa-envelope"></i> <span data-i18n="book.email.label">Email (optional — for advanced-appointment reminders by email)</span></label>
        <input class="input" id="patEmail" type="email" placeholder="you@example.com" data-i18n-ph="book.email.ph" />
      </div>

      <button class="btn btn-green btn-block btn-lg mt-20" id="btnSubmitToken" onclick="generatePatientToken()">
        <i class="fa-solid fa-ticket"></i> <span data-i18n="book.cta.token">Confirm &amp; Get Live Token</span>
      </button>

      <button class="btn btn-slate btn-block mt-10" onclick="resetHospitalSelection()" style="background:transparent;border:none;">
        <i class="fa-solid fa-arrow-rotate-left"></i> <span data-i18n="book.changeHospital">Change Hospital</span>
      </button>
    </div>

  </div>

  <script src="js/firebase-config.js?v=20261002"></script>
  <script src="js/app.js?v=20261002"></script>
  <script src="js/firebase.js?v=20261002"></script>
  <script src="js/queue-domain.js?v=20261002"></script>
  <script src="js/api.js?v=20261003"></script>
  <script src="js/i18n.js?v=20261002"></script>
  <script>
    if (window.I18N) I18N.init();
    function l10n(key, fb) { return (window.I18N && window.I18N.t) ? window.I18N.t(key) : fb; }
    window.escHtml = window.escHtml || function(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };

    window.showToast = window.showToast || function(msg, isErr, ms) {
      let w = document.getElementById('hkToastWrap');
      if (!w) {
        w = document.createElement('div');
        w.id = 'hkToastWrap';
        w.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
        document.body.appendChild(w);
      }
      const t = document.createElement('div');
      t.style.cssText = `background:${isErr ? '#ef4444' : '#2A835F'};color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.9rem;box-shadow:0 10px 25px rgba(0,0,0,0.2);transition:opacity 0.3s;`;
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms || 2500);
    };

    window.pad3 = window.pad3 || function(n) {
      return String(n).padStart(3, '0');
    };

    let targetHospitalSlug = null;
    let selectedDoctorId = null;
    let selectedDoctorName = 'Doctor';
    let hospitalDirectory = [];
    let apptDate = null;
    let apptSlot = null;
    let apptSlotsCache = null;
    const FUNC = window.TokSpotAPI && window.TokSpotAPI.mode() === 'functions';
    const resolvedHospitalCache = {};

    // ---- In-app appointment reminders (my upcoming bookings) ----
    const MY_APPTS_KEY = 'tokspot_my_appts';
    function loadMyAppts() {
      try { return JSON.parse(localStorage.getItem(MY_APPTS_KEY) || '[]'); } catch (_) { return []; }
    }
    function saveMyAppts(list) {
      localStorage.setItem(MY_APPTS_KEY, JSON.stringify(list.slice(-12)));
    }
    function addMyAppt(a) {
      const list = loadMyAppts().filter((x) => x.id !== a.id);
      list.push({ ...a, at: Date.now() });
      saveMyAppts(list);
      renderMyApptReminder();
    }
    function removeMyAppt(id) {
      saveMyAppts(loadMyAppts().filter((x) => x.id !== id));
      renderMyApptReminder();
    }
    function renderMyApptReminder() {
      const wrap = document.getElementById('myApptReminder');
      if (!wrap) return;
      const today = window.todayStr ? window.todayStr() : new Date().toISOString().slice(0, 10);
      const tomorrow = new Date(new Date(today + 'T00:00:00Z').getTime() + 86400000).toISOString().slice(0, 10);
      const soon = loadMyAppts().filter((a) => a.date === today || a.date === tomorrow).slice(0, 2);
      if (!soon.length) { wrap.classList.add('hidden'); return; }
      wrap.classList.remove('hidden');
      wrap.innerHTML = soon.map((a) => {
        const when = a.date === today
          ? l10n('book.reminder.today', 'Appointment TODAY at %s').replace('%s', a.slotStart)
          : l10n('book.reminder.tomorrow', 'Appointment TOMORROW at %s').replace('%s', a.slotStart);
        const place = [a.hospitalName, a.doctorName].filter(Boolean).join(' · ');
        return '<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;">' +
          '<span><i class="fa-solid fa-calendar-check"></i> <b>' + escHtml(when) + '</b>' +
          (place ? ' — ' + escHtml(place) : '') + '</span>' +
          '<button class="btn btn-sm btn-slate" style="padding:4px 8px;border-radius:8px;font-weight:700;" onclick="removeMyAppt(\'' + escHtml(a.id) + '\')">' + l10n('book.reminder.remove', 'Remove') + '</button></div>';
      }).join('<div style="height:8px;"></div>');
    }

    async function ensureAuth() {
      if (!window._auth.currentUser) {
        try { await window._useAuth.signInAnonymously(window._auth); } catch (e) {}
      }
    }

    window.addEventListener('load', async () => {
      if (window.hk && hk.applyDark) hk.applyDark();

      try {
        if (typeof initFirebase === 'function') await initFirebase();
        if (typeof waitForFB === 'function') await waitForFB();
      } catch (e) {}

      await ensureAuth();
      await loadHospitalDirectory();
      renderMyApptReminder();

      const params = new URLSearchParams(window.location.search);
      const urlCode = params.get('code') || params.get('h');
      if (urlCode) {
        document.getElementById('hospitalSearchInput').value = urlCode.toUpperCase();
        if (FUNC) forceDirectLookup();
        else handleSearch(true);
      }
    });

    async function loadHospitalDirectory() {
      const loader = document.getElementById('searchLoader');
      if (loader) loader.classList.remove('hidden');

      try {
        // Functions mode: no public hospital scan exists (privacy by
        // design) — search resolves by hospital code via the backend.
        if (FUNC) {
          hospitalDirectory = [];
          return;
        }
        await ensureAuth();
        const snap = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals'));
        hospitalDirectory = snap.docs.map(doc => {
          const data = doc.data();
          return {
            id: doc.id,
            name: data.name || doc.id,
            city: data.city || '',
            code: (data.hospitalCode || data.code || '').toUpperCase()
          };
        });
      } catch (err) {
        console.error("Directory load failed:", err);
      } finally {
        if (loader) loader.classList.add('hidden');
      }
    }

    async function handleSearch(autoSelectExact = false) {
      const inputEl = document.getElementById('hospitalSearchInput');
      const query = inputEl.value.trim().toLowerCase();
      const resultsBox = document.getElementById('searchResults');
      const directBtn = document.getElementById('directLookupBtn');
      
      if (query.length < 1) {
        resultsBox.classList.add('hidden');
        if (directBtn) directBtn.classList.add('hidden');
        return;
      }

      if (!hospitalDirectory.length) {
        await loadHospitalDirectory();
      }

      const cleanNumQuery = query.replace(/^hosp-?/i, '');

      const filtered = hospitalDirectory.filter(h => {
        const hName = h.name.toLowerCase();
        const hCity = h.city.toLowerCase();
        const hCode = h.code.toLowerCase();
        const hId = h.id.toLowerCase();
        const cleanCodeNum = hCode.replace(/^hosp-?/i, '');

        return hName.includes(query) || 
               hCity.includes(query) || 
               hCode.includes(query) || 
               hId.includes(query) || 
               (cleanNumQuery && cleanCodeNum === cleanNumQuery);
      });

      if (autoSelectExact && filtered.length >= 1) {
        selectHospital(filtered[0].id);
        return;
      }

      if (filtered.length === 0) {
        resultsBox.innerHTML = `
          <div class="search-item muted" style="text-align:center;padding:16px;">
            No hospital found matching "<b>${escHtml(query)}</b>".
          </div>
        `;
        resultsBox.classList.remove('hidden');
        if (directBtn) directBtn.classList.remove('hidden');
        return;
      }

      if (directBtn) directBtn.classList.add('hidden');

      resultsBox.innerHTML = filtered.map(h => `
        <div class="search-item" onclick="selectHospital('${h.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:700; color:var(--ink);">${escHtml(h.name)}</div>
            <div style="font-size:0.75rem; font-weight:800; color:var(--green); background:var(--green-050); padding:2px 6px; border-radius:6px;">${escHtml(h.code)}</div>
          </div>
          <div class="muted" style="font-size:0.8rem; margin-top:2px;">
            <i class="fa-solid fa-location-dot"></i> ${escHtml(h.city || 'Consultation Station')} · ID: ${escHtml(h.id)}
          </div>
        </div>
      `).join('');
      
      resultsBox.classList.remove('hidden');
    }

    async function forceDirectLookup() {
      const raw = document.getElementById('hospitalSearchInput').value.trim().toUpperCase();
      if (!raw) return;

      const loader = document.getElementById('searchLoader');
      if (loader) loader.classList.remove('hidden');

      try {
        // Functions mode: resolve the code through the trusted backend
        // (no client hospital scan — rules deny it for anonymous visitors).
        if (FUNC) {
          const resolved = await window.TokSpotAPI.resolveHospitalByCode({ code: raw });
          resolvedHospitalCache[resolved.id] = {
            id: resolved.id,
            name: resolved.name,
            city: '',
            code: resolved.hospitalCode || raw,
          };
          selectHospital(resolved.id);
          return;
        }

        await ensureAuth();
        const hospSnap = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals'));
        const cleanInput = raw.replace(/^HOSP-?/i, '');

        const found = hospSnap.docs.find(d => {
          const data = d.data();
          const c = (data.hospitalCode || data.code || '').toUpperCase();
          return c === raw || c.replace(/^HOSP-?/i, '') === cleanInput || d.id.toUpperCase() === raw;
        });

        if (found) {
          selectHospital(found.id);
        } else {
          showToast(l10n('book.err.codeNotFound', `Hospital Code "${raw}" not found in system.`), true);
        }
      } catch (e) {
        showToast(l10n('book.err.lookup') + e.message, true);
      } finally {
        if (loader) loader.classList.add('hidden');
      }
    }

    async function selectHospital(slug) {
      document.getElementById('searchResults').classList.add('hidden');

      let hData = hospitalDirectory.find(h => h.id === slug) || resolvedHospitalCache[slug];
      if (!hData) {
        try {
          if (FUNC) {
            const resolved = await window.TokSpotAPI.resolveHospitalByCode({ code: slug });
            resolvedHospitalCache[slug] = {
              id: resolved.id, name: resolved.name, city: '', code: resolved.hospitalCode || slug,
            };
            hData = resolvedHospitalCache[slug];
          } else {
            const docSnap = await window._fs.getDoc(window._fs.doc(window._db, 'hospitals', slug));
            if (docSnap.exists()) {
              const d = docSnap.data();
              hData = { id: docSnap.id, name: d.name || docSnap.id, city: d.city || '', code: d.hospitalCode || d.code || '' };
            }
          }
        } catch(e) {}
      }

      if (!hData) return;

      targetHospitalSlug = hData.id;

      document.getElementById('dispHospitalName').textContent = hData.name;
      document.getElementById('dispHospitalCity').textContent = hData.city ? `Station: ${hData.city}` : 'Consultation Station';
      document.getElementById('dispCodeTag').textContent = hData.code;

      await loadDoctors(targetHospitalSlug);

      document.getElementById('stepCode').classList.add('hidden');
      document.getElementById('stepDetails').classList.remove('hidden');
    }

    async function loadDoctors(slug) {
      const list = document.getElementById('doctorOptionsList');
      list.innerHTML = '<div class="muted"><i class="fa-solid fa-spinner fa-spin"></i> Loading available doctors...</div>';

      try {
        let doctors = [];
        if (FUNC) {
          // Sanitized server list — no client read of the doctors doc.
          const res = await window.TokSpotAPI.listDoctorsPublic({ slug });
          doctors = res.doctors || [];
        } else {
          await ensureAuth();
          const snap = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals', slug, 'doctors'));
          doctors = snap.docs.map(d => ({ id: d.id, status: d.data().status, onBreak: Boolean(d.data().onBreak), breakNote: d.data().breakNote || '', name: d.data().name, department: d.data().department }));
        }

        list.innerHTML = '';

        if (!doctors.length) {
          list.innerHTML = '<div class="empty">No doctors currently scheduled. Please check with reception.</div>';
          selectedDoctorId = null;
          return;
        }

        let isFirst = true;
        doctors.forEach(doc => {
          if (doc.status === 'closed') return;

          const onBreak = Boolean(doc.onBreak) || doc.displayStatus === 'break';
          const availability = onBreak
            ? `<span style="font-size:0.8rem;font-weight:800;color:#d97706;"><i class="fa-solid fa-mug-hot"></i> On Break${doc.breakNote ? ' — ' + escHtml(doc.breakNote) : ''}</span>`
            : `<span style="font-size:0.8rem;font-weight:800;color:var(--green);"><i class="fa-solid fa-circle-check"></i> Available</span>`;

          const div = document.createElement('div');
          div.className = `doc-radio ${isFirst ? 'selected' : ''}`;
          div.onclick = () => selectDoctor(doc.id, doc.name || 'Doctor', div);

          div.innerHTML = `
            <input type="radio" name="docSelection" value="${doc.id}" ${isFirst ? 'checked' : ''} />
            <div style="flex:1;">
              <div style="font-weight:700;font-size:0.95rem;color:var(--ink);">${escHtml(doc.name || 'Doctor')}</div>
              <div class="muted" style="font-size:0.8rem;">${escHtml(doc.department || 'Consultation')}</div>
            </div>
            ${availability}
          `;
          list.appendChild(div);

          if (isFirst) {
            selectedDoctorId = doc.id;
            selectedDoctorName = doc.name || 'Doctor';
            isFirst = false;
          }
        });
      } catch (e) {
        list.innerHTML = '<div class="muted">Could not load doctors: ' + escHtml(e.message) + '</div>';
      }
    }

    function selectDoctor(docId, docName, element) {
      selectedDoctorId = docId;
      selectedDoctorName = docName;
      document.querySelectorAll('.doc-radio').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      resetApptPicker();
      renderApptDates();
    }

    // ---- Advanced appointment picker ----
    function resetApptPicker() {
      apptDate = null;
      apptSlot = null;
      apptSlotsCache = null;
      document.getElementById('apptSlotsWrap').classList.add('hidden');
    }

    function apptSlotWindows(schedule, dateStr) {
      const windows = [];
      if (Array.isArray(schedule) && schedule.length) {
        const day = new Date(dateStr + 'T00:00:00Z').getUTCDay();
        schedule.forEach((s) => {
          if (Number(s.day) === day && s.start < s.end) windows.push({ start: s.start, end: s.end });
        });
      } else {
        windows.push({ start: '09:00', end: '13:00' });
      }
      return windows;
    }

    function allApptSlots(windows) {
      const out = [];
      const mins = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t)); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
      const fmt = (t) => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
      for (const w of windows) {
        let cur = mins(w.start);
        const end = mins(w.end);
        if (cur === null || end === null) continue;
        while (cur + 15 <= end) { out.push(fmt(cur)); cur += 15; }
      }
      return out;
    }

    function renderApptDates() {
      const row = document.getElementById('apptDateRow');
      if (!row) return;
      const today = window.todayStr ? window.todayStr() : new Date().toISOString().slice(0, 10);
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      row.innerHTML = '';
      apptDate = null;
      apptSlot = null;
      document.getElementById('apptSlotsWrap').classList.add('hidden');

      for (let i = 0; i < 7; i++) {
        const d = new Date(new Date(today + 'T00:00:00Z').getTime() + i * 86400000);
        const iso = d.toISOString().slice(0, 10);
        const label = i === 0 ? (window.I18N ? I18N.t('book.appt.today') : 'Today')
          : i === 1 ? (window.I18N ? I18N.t('book.appt.tomorrow') : 'Tomorrow')
          : dayNames[d.getUTCDay()] + ' ' + String(d.getUTCDate()).padStart(2, '0');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm btn-slate';
        btn.style.cssText = 'border-radius:10px;font-weight:800;font-size:.8rem;';
        btn.textContent = label;
        btn.onclick = () => {
          apptDate = iso;
          apptSlot = null;
          row.querySelectorAll('button').forEach(b => b.style.borderColor = '');
          btn.style.borderColor = 'var(--green)';
          loadApptSlots(iso);
        };
        row.appendChild(btn);
      }
    }

    async function loadApptSlots(iso) {
      const wrap = document.getElementById('apptSlotsWrap');
      const box = document.getElementById('apptSlotsRow');
      const dateLabel = document.getElementById('apptSlotsDateLabel');
      wrap.classList.remove('hidden');
      box.innerHTML = '<div class="muted" style="font-size:.8rem;">Loading slots…</div>';
      const parts = iso.split('-');
      dateLabel.textContent = `${parts[2]}/${parts[1]}/${parts[0]}`;

      try {
        let slots = [];
        const takenSet = new Set();
        if (FUNC) {
          const res = await window.TokSpotAPI.listAvailableSlots({ slug: targetHospitalSlug, doctorId: selectedDoctorId, date: iso });
          (res.slots || []).forEach((s) => {
            slots.push(s.start);
            if (s.taken) takenSet.add(s.start);
          });
        } else {
          await ensureAuth();
          const doctorSnap = await window._fs.getDoc(window._fs.doc(window._db, 'hospitals', targetHospitalSlug, 'doctors', selectedDoctorId));
          const schedule = doctorSnap.exists() ? (doctorSnap.data().schedule || null) : null;
          slots = allApptSlots(apptSlotWindows(schedule, iso));
          const apptSnap = await window._fs.getDocs(window._fs.query(
            window._fs.collection(window._db, 'hospitals', targetHospitalSlug, 'appointments'),
            window._fs.where('doctorId', '==', selectedDoctorId),
            window._fs.where('date', '==', iso)
          ));
          apptSnap.docs.forEach((d) => {
            const a = d.data();
            if (a.status === 'booked' || a.status === 'arrived') takenSet.add(a.slotStart);
          });
        }

        if (!slots.length) {
          box.innerHTML = '<div class="muted" style="font-size:.8rem;">No consultation windows on this date for this doctor.</div>';
          return;
        }
        apptSlotsCache = { date: iso, slots, takenSet };
        box.innerHTML = '';
        slots.forEach((s) => {
          const taken = takenSet.has(s);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-sm ' + (taken ? 'btn-slate' : 'btn-green');
          btn.style.cssText = 'border-radius:10px;font-weight:800;font-size:.8rem;' + (taken ? 'opacity:.45;text-decoration:line-through;cursor:not-allowed;' : '');
          btn.textContent = s;
          btn.disabled = taken;
          btn.onclick = () => {
            apptSlot = s;
            box.querySelectorAll('button').forEach(b => b.style.outline = '');
            btn.style.outline = '3px solid var(--ink)';
          };
          box.appendChild(btn);
        });
      } catch (e) {
        console.error('Slot load error:', e);
        box.innerHTML = '<div class="muted" style="font-size:.8rem;">Could not load slots: ' + escHtml(e.message) + '</div>';
      }
    }

    function resetHospitalSelection() {
      targetHospitalSlug = null;
      selectedDoctorId = null;
      document.getElementById('hospitalSearchInput').value = '';
      document.getElementById('stepDetails').classList.add('hidden');
      document.getElementById('stepCode').classList.remove('hidden');
      document.getElementById('hospitalSearchInput').focus();
    }

    async function generatePatientToken() {
      const name = document.getElementById('patName').value.trim();
      const phone = document.getElementById('patPhone').value.trim().replace(/\D/g, '');
      const email = document.getElementById('patEmail').value.trim();
      const btn = document.getElementById('btnSubmitToken');

      if (!name) return showToast(l10n('book.err.name', 'Please enter patient name.'), true);
      if (!phone || phone.length !== 10) return showToast(l10n('book.err.phone', 'Please enter a valid 10-digit mobile number.'), true);
      if (!selectedDoctorId) return showToast(l10n('book.err.doctor', 'Please select a doctor.'), true);

      const isAppointment = Boolean(apptDate && apptSlot);
      if (isAppointment && email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        return showToast(l10n('book.err.email', 'Please enter a valid email address.'), true);
      }

      btn.disabled = true;

      if (isAppointment) {
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Booking Appointment Slot...';
        try {
          await ensureAuth();
          if (FUNC) {
            await window.TokSpotAPI.createAppointment({
              slug: targetHospitalSlug,
              doctorId: selectedDoctorId,
              date: apptDate,
              slotStart: apptSlot,
              name,
              phone,
              email,
            });
          } else {
            await window._fs.addDoc(
              window._fs.collection(window._db, 'hospitals', targetHospitalSlug, 'appointments'),
              {
                doctorId: selectedDoctorId,
                doctorName: selectedDoctorName || 'Doctor',
                date: apptDate,
                slotStart: apptSlot,
                patientName: name,
                phone,
                email: email || null,
                status: 'booked',
                tokenId: null,
                createdBy: 'patient',
                createdAt: window._fs.serverTimestamp ? window._fs.serverTimestamp() : new Date(),
              }
            );
          }
          addMyAppt({
            id: apptDate + '_' + apptSlot,
            date: apptDate,
            slotStart: apptSlot,
            doctorName: selectedDoctorName || 'Doctor',
            hospitalName: document.getElementById('dispHospitalName') ? document.getElementById('dispHospitalName').textContent : '',
          });
          const parts = apptDate.split('-');
          const niceDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
          showToast(l10n('book.ok.appt', `Appointment booked for ${niceDate} at ${apptSlot}!`).replace('%s', niceDate).replace('%s', apptSlot));
          setTimeout(() => {
            document.getElementById('stepDetails').classList.add('hidden');
            document.getElementById('stepCode').classList.remove('hidden');
            document.getElementById('patName').value = '';
            document.getElementById('patPhone').value = '';
            resetApptPicker();
            document.getElementById('hospitalSearchInput').value = '';
          }, 350);
          return;
        } catch (err) {
          console.error('Appointment Booking Error:', err);
          showToast(l10n('book.err.apptFail', 'Appointment booking failed: ') + err.message, true);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-ticket"></i> Confirm &amp; Get Live Token';
          return;
        }
      }

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating Token...';

      try {
        await ensureAuth();
        const { tokenNum, tokenId } = await window.TokSpotAPI.issueToken({
          slug: targetHospitalSlug,
          doctorId: selectedDoctorId,
          doctorName: selectedDoctorName,
          name,
          phone,
          priority: false,
          counter: 'Counter A',
          source: 'self',
          extra: {
            hospitalSlug: targetHospitalSlug,
            bookedFrom: 'online'
          }
        });
        const createdTokenId = tokenId;

        showToast(l10n('book.ok.token', `Token #${tokenNum} booked successfully!`).replace('%s', tokenNum));
        setTimeout(() => {
          window.location.href = `token.html?id=${encodeURIComponent(createdTokenId)}&h=${encodeURIComponent(targetHospitalSlug)}`;
        }, 350);

      } catch (err) {
        console.error('Booking Error:', err);
        showToast(l10n('book.err.tokenFail', 'Token booking failed: ') + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-ticket"></i> Confirm &amp; Get Live Token';
      }
    }
  </script>
</body>
