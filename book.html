<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Book Token — TokSpot</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    body { background: #f8fafc; color: var(--ink); }
    .book-container { max-width: 480px; margin: 30px auto; padding: 0 16px; }
    .step-card {
      background: #ffffff; border: 1px solid var(--line); border-radius: 20px;
      padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .badge-code {
      background: #dcfce7; color: #15803d; font-weight: 800;
      padding: 4px 10px; border-radius: 8px; font-size: 0.85rem;
    }
    .doc-radio {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
      margin-bottom: 10px; transition: border-color .2s, background .2s;
    }
    .doc-radio.selected { border-color: var(--green); background: #f0fdf4; }
    .doc-radio input { display: none; }

    /* Smart Search Dropdown Styles */
    .search-wrapper { position: relative; }
    .search-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; background: #ffffff;
      border: 1px solid var(--line); border-radius: 12px; margin-top: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 220px; overflow-y: auto; z-index: 50;
    }
    .search-item {
      padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
      transition: background 0.2s;
    }
    .search-item:hover { background: #f1f5f9; }
    .search-item:last-child { border-bottom: none; }
    
    body.dark { background: #060b16; }
    body.dark .step-card { background: #121a2b; border-color: #24314a; }
    body.dark .doc-radio { border-color: #24314a; background: #0f172a; }
    body.dark .doc-radio.selected { border-color: var(--green); background: #052e16; }
    body.dark .search-dropdown { background: #1e293b; border-color: #334155; }
    body.dark .search-item { border-color: #334155; }
    body.dark .search-item:hover { background: #0f172a; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="logomark"><img src="logo.png" alt="TokSpot" /></span>TokSpot
    </a>
    <span class="spacer"></span>
    <button class="icn-btn" onclick="hk.toggleDark()"><i class="fa-solid fa-moon"></i></button>
  </div>

  <div class="book-container">

    <!-- STEP 1: Search Hospital Name or Enter Code -->
    <div class="step-card" id="stepCode">
      <div style="font-weight: 800; font-size: 1.2rem; margin-bottom: 6px;">
        <i class="fa-solid fa-hospital" style="color:var(--green);margin-right:8px;"></i>Find Your Hospital
      </div>
      <div class="muted" style="font-size: 0.88rem; margin-bottom: 16px;">
        Search by Hospital Name, City, or enter your 4-digit booking code.
      </div>
      
      <div class="search-wrapper">
        <input class="input" id="hospitalSearchInput" type="text" placeholder="e.g. City Care or HOSP-1234" autocomplete="off" oninput="handleSearch()" style="font-weight:700; padding:14px 16px;" />
        
        <div id="searchResults" class="search-dropdown hidden"></div>
      </div>
    </div>

    <!-- STEP 2: Choose Doctor & Enter Patient Details -->
    <div class="step-card hidden" id="stepDetails">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px dashed var(--line); padding-bottom:12px;">
        <div>
          <div style="font-weight: 800; font-size: 1.1rem;" id="dispHospitalName">—</div>
          <div class="muted" style="font-size: 0.82rem;" id="dispHospitalCity">—</div>
        </div>
        <span class="badge-code" id="dispCodeTag">CODE</span>
      </div>

      <!-- Select Doctor -->
      <div class="field">
        <label class="label"><i class="fa-solid fa-user-doctor"></i> Select Doctor</label>
        <div id="doctorOptionsList" style="margin-top: 8px;"></div>
      </div>

      <!-- Patient Information -->
      <div class="field mt-16">
        <label class="label">Patient Full Name <span class="req">*</span></label>
        <input class="input" id="patName" type="text" placeholder="e.g. Rahul Sharma" />
      </div>

      <div class="field">
        <label class="label">Phone Number <span class="req">*</span> <span class="muted">(for arrival alerts)</span></label>
        <input class="input" id="patPhone" type="tel" maxlength="10" placeholder="10-digit mobile number" />
      </div>

      <button class="btn btn-green btn-block btn-lg mt-20" id="btnSubmitToken" onclick="generatePatientToken()">
        <i class="fa-solid fa-ticket"></i> Confirm &amp; Get Live Token
      </button>

      <button class="btn btn-slate btn-block mt-10" onclick="resetHospitalSelection()" style="background:transparent;border:none;">
        <i class="fa-solid fa-arrow-rotate-left"></i> Change Hospital
      </button>
    </div>

  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    if (window.hk && hk.applyDark) hk.applyDark();

    let targetHospitalSlug = null;
    let selectedDoctorId = null;
    let hospitalDirectory = [];

    window.addEventListener('load', async () => {
      await initFirebase();
      await waitForFB();

      // Load all hospitals quietly in background for fast searching
      loadHospitalDirectory();

      // Direct URL Booking Check (?code=XYZ)
      const params = new URLSearchParams(window.location.search);
      const urlCode = params.get('code') || params.get('h');
      if (urlCode) {
        document.getElementById('hospitalSearchInput').value = urlCode;
        setTimeout(() => handleSearch(true), 500); // Trigger search auto-select
      }
    });

    async function loadHospitalDirectory() {
      try {
        const snap = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals'));
        hospitalDirectory = snap.docs.map(doc => {
          const data = doc.data();
          return {
            id: doc.id,
            name: data.name || doc.id,
            city: data.city || '',
            code: data.hospitalCode || data.code || ''
          };
        });
      } catch (err) {
        console.error("Directory load failed:", err);
      }
    }

    function handleSearch(autoSelectExact = false) {
      const query = document.getElementById('hospitalSearchInput').value.trim().toLowerCase();
      const resultsBox = document.getElementById('searchResults');
      
      if (query.length < 2) {
        resultsBox.classList.add('hidden');
        return;
      }

      const filtered = hospitalDirectory.filter(h => 
        h.name.toLowerCase().includes(query) || 
        h.city.toLowerCase().includes(query) || 
        h.code.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        resultsBox.innerHTML = '<div class="search-item muted">No hospitals found matching your search.</div>';
        resultsBox.classList.remove('hidden');
        return;
      }

      // If came from QR code and exact match is found, auto-select it
      if (autoSelectExact && filtered.length === 1 && filtered[0].code.toLowerCase() === query) {
        selectHospital(filtered[0].id);
        return;
      }

      resultsBox.innerHTML = filtered.map(h => `
        <div class="search-item" onclick="selectHospital('${h.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:700; color:var(--ink);">${escHtml(h.name)}</div>
            <div style="font-size:0.75rem; font-weight:800; color:var(--green); background:var(--green-050); padding:2px 6px; border-radius:6px;">${escHtml(h.code)}</div>
          </div>
          <div class="muted" style="font-size:0.8rem; margin-top:2px;"><i class="fa-solid fa-location-dot"></i> ${escHtml(h.city || 'Consultation Clinic')}</div>
        </div>
      `).join('');
      
      resultsBox.classList.remove('hidden');
    }

    async function selectHospital(slug) {
      document.getElementById('searchResults').classList.add('hidden');
      
      const hData = hospitalDirectory.find(h => h.id === slug);
      if (!hData) return;

      targetHospitalSlug = hData.id;

      // Render header
      document.getElementById('dispHospitalName').textContent = hData.name;
      document.getElementById('dispHospitalCity').textContent = hData.city || 'Consultation Station';
      document.getElementById('dispCodeTag').textContent = hData.code;

      await loadDoctors(targetHospitalSlug);

      // Switch Steps
      document.getElementById('stepCode').classList.add('hidden');
      document.getElementById('stepDetails').classList.remove('hidden');
    }

    async function loadDoctors(slug) {
      const list = document.getElementById('doctorOptionsList');
      list.innerHTML = '<div class="muted">Loading doctors...</div>';

      try {
        const snap = await window._fs.getDocs(window._fs.collection(window._db, 'hospitals', slug, 'doctors'));
        list.innerHTML = '';

        if (snap.empty) {
          list.innerHTML = '<div class="empty">No doctors currently available for booking.</div>';
          return;
        }

        let isFirst = true;
        snap.docs.forEach(d => {
          const doc = d.data();
          if (doc.status === 'closed') return;

          const div = document.createElement('div');
          div.className = `doc-radio ${isFirst ? 'selected' : ''}`;
          div.onclick = () => selectDoctor(d.id, div);

          div.innerHTML = `
            <input type="radio" name="docSelection" value="${d.id}" ${isFirst ? 'checked' : ''} />
            <div style="flex:1;">
              <div style="font-weight:700;font-size:0.95rem;">${escHtml(doc.name || 'Doctor')}</div>
              <div class="muted" style="font-size:0.8rem;">${escHtml(doc.department || 'Consultation')}</div>
            </div>
            <span style="font-size:0.8rem;font-weight:700;color:var(--green);">Available</span>
          `;
          list.appendChild(div);

          if (isFirst) {
            selectedDoctorId = d.id;
            isFirst = false;
          }
        });
      } catch (e) {
        list.innerHTML = '<div class="muted">Could not load doctors list.</div>';
      }
    }

    function selectDoctor(docId, element) {
      selectedDoctorId = docId;
      document.querySelectorAll('.doc-radio').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
    }

    function resetHospitalSelection() {
      targetHospitalSlug = null;
      selectedDoctorId = null;
      document.getElementById('hospitalSearchInput').value = '';
      document.getElementById('stepDetails').classList.add('hidden');
      document.getElementById('stepCode').classList.remove('hidden');
      document.getElementById('hospitalSearchInput').focus();
    }

    async function generatePatientToken() {
      const name = document.getElementById('patName').value.trim();
      const phone = document.getElementById('patPhone').value.trim();
      const btn = document.getElementById('btnSubmitToken');

      if (!name) return showToast('Please enter patient name.', true);
      if (!phone || phone.length < 10) return showToast('Please enter a valid 10-digit phone number.', true);
      if (!selectedDoctorId) return showToast('Please select a doctor.', true);

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating Token...';

      try {
        const today = window.todayStr ? window.todayStr() : new Date().toISOString().slice(0,10);
        
        const tokensColl = window._fs.collection(window._db, 'hospitals', targetHospitalSlug, 'tokens');
        const qToday = window._fs.query(
          tokensColl,
          window._fs.where('doctorId', '==', selectedDoctorId),
          window._fs.where('date', '==', today)
        );
        const snap = await window._fs.getDocs(qToday);
        const nextNum = snap.size + 1;

        const newTokenDoc = await window._fs.addDoc(tokensColl, {
          number: nextNum,
          patientName: name,
          phone: phone,
          doctorId: selectedDoctorId,
          hospitalSlug: targetHospitalSlug,
          date: today,
          status: 'waiting',
          bookedFrom: 'online',
          createdAt: window._fs.serverTimestamp()
        });

        window.location.href = `token.html?id=${newTokenDoc.id}&h=${targetHospitalSlug}`;

      } catch (err) {
        showToast('Token booking failed: ' + err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-ticket"></i> Confirm &amp; Get Live Token';
      }
    }
  </script>
</body>
</html>
